<!doctype html>
<html class="h-full w-full writing-horizontal-tb" lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#37474f" />
    <title>%WEB_TITLE%</title>
    <script src="{{BASE_PATH}}/appearance-init.js"></script>
    <link rel="manifest" href="{{BASE_PATH}}/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="152x152" href="{{BASE_PATH}}/favicon.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="{{BASE_PATH}}/icons/regular-icon@32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="{{BASE_PATH}}/icons/regular-icon@16x16.png"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="{{BASE_PATH}}/apple-touch-icon.png" />
    <link rel="mask-icon" href="{{BASE_PATH}}/safari-pinned-tab.svg" color="#37474f" />
    <style id="expo-reset">
      html,
      body,
      #root {
        height: 100%;
        width: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
      }
      #root {
        display: flex;
        flex: 1;
      }
    </style>
  </head>
  <body class="h-full w-full font-sans break-words">
    <noscript>Manabi Reader requires JavaScript to open your local library.</noscript>
    <div id="root"></div>
  </body>
</html>
