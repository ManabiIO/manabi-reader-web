name: Library parity merge workspace
on:
  push:
    branches: [integrate/library-parity-main-20260928]
    paths: [.github/workflows/library-parity-merge-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build exact merge workspace
        run: |
          set -uo pipefail
          git fetch origin 77947ea646390296418d9ef73a3c331f1c1057a2
          git config user.email merge-workspace@example.invalid
          git config user.name merge-workspace
          git merge --no-commit --no-ff 77947ea646390296418d9ef73a3c331f1c1057a2 || true
          mkdir -p /tmp/library-parity-merge
          git status --short > /tmp/library-parity-merge/status.txt
          git diff --name-only --diff-filter=U > /tmp/library-parity-merge/conflicts.txt
          git diff --binary > /tmp/library-parity-merge/working.diff
          git diff --cached --binary > /tmp/library-parity-merge/index.diff
          tar --exclude=.git -czf /tmp/library-parity-merge/worktree.tar.gz .
          git rev-parse HEAD > /tmp/library-parity-merge/main-head.txt
          git rev-parse MERGE_HEAD > /tmp/library-parity-merge/feature-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: library-parity-merge-workspace
          path: /tmp/library-parity-merge
          retention-days: 1
          if-no-files-found: error
