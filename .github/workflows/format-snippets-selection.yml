name: Format snippets selection follow-up
on:
  push:
    branches: [refine/snippets-selection-keyboard-20260930]
    paths: ['.github/workflows/format-snippets-selection.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v6.1.0
        with: { version: '12.3.4' }
      - uses: actions/setup-node@v4
        with: { node-version: '24.21.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Format only the owned snippets selection files
        run: |
          pnpm exec prettier --write apps/web/src/lib/snippets/workspace.svelte test/snippets/browser.mjs
          git diff --check
          git diff --exit-code -- test/snippets/browser.mjs || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/lib/snippets/workspace.svelte test/snippets/browser.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'style(snippets): format selection keyboard follow-up'
            git push origin HEAD:refs/heads/refine/snippets-selection-keyboard-20260930
          fi