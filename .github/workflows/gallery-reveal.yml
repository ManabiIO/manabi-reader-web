name: Gallery reveal lifetime
on:
  pull_request:
    paths:
      - 'apps/web/src/lib/components/book-reader/book-reader-image-gallery/**'
      - 'apps/web/src/lib/components/book-reader/reactive-elements.ts'
      - 'apps/web/src/lib/components/book-reader/book-reader-continuous/**'
      - 'apps/web/src/lib/functions/reader-font-layout.ts'
      - 'apps/web/src/lib/components/html-renderer.svelte'
      - 'tests/browser/test_gallery_reveal_lifetime.py'
      - 'tests/browser/test_gallery_continuity.py'
      - 'tests/unit/gallery-reveal*'
      - 'tests/unit/html-renderer-readiness.test.mjs'
      - '.github/workflows/gallery-reveal.yml'
permissions:
  contents: read
concurrency:
  group: gallery-reveal-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - run: pnpm --dir apps/web check
      - run: node --experimental-strip-types --test tests/unit/gallery-reveal*.test.mjs tests/unit/html-renderer-readiness.test.mjs
      - name: Build the real subpath application
        env:
          BASE_PATH: /reader-web
        run: pnpm build
      - name: Record candidate
        run: |
          mkdir -p test-results/source
          git rev-parse HEAD > test-results/source/commit.txt
          git ls-tree -r HEAD > test-results/source/tree.txt
          cp tests/browser/test_gallery_{reveal_lifetime,continuity}.py test-results/source/
          cp apps/web/src/lib/components/html-renderer.svelte test-results/source/
          cp apps/web/src/lib/components/book-reader/reactive-elements.ts test-results/source/
          cp apps/web/src/lib/functions/reader-font-layout.ts test-results/source/
          cp apps/web/src/lib/components/book-reader/book-reader-continuous/book-reader-continuous.svelte test-results/source/
          cp apps/web/src/lib/components/book-reader/book-reader-image-gallery/{book-reader-image-gallery.svelte,reveal-gallery-picture.ts} test-results/source/
      - name: Both real browser engines
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium webkit
          set +e
          status=0
          for engine in chromium webkit; do
            LIBRARY_BROWSER=$engine PYTHONPATH=tests/browser python -m unittest test_gallery_reveal_lifetime test_gallery_continuity -v 2>&1 | tee test-results/gallery-$engine.log
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then status=1; fi
            APPEARANCE_BROWSER=$engine PYTHONPATH=tests/browser python -m unittest test_rhea_ui.RheaReader.test_gallery_spoiler_reveal_is_a_real_keyboard_button -v 2>&1 | tee test-results/existing-gallery-$engine.log
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then status=1; fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-reveal-evidence
          path: test-results/
          retention-days: 7
