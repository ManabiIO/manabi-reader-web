name: Prepare verified search-quality source
on:
  push:
    branches: [qa/publish-search-quality-20260928]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e66fc3b444ceac3866bfb4683cb4f2dee126b540
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Retain the reviewed merge candidate's additional component lint coverage
        run: |
          git fetch --no-tags --depth=1 origin 04dc782796f20e39fbd5dc6a05302bebe2d4ece0
          git checkout 04dc782796f20e39fbd5dc6a05302bebe2d4ece0 -- tools/appearance/lint.mjs
          test "$(git hash-object tools/appearance/lint.mjs)" = c58467654fa444f2371982be02b042d8d038d893
      - name: Verify preimages, apply reviewed patch and format pinned source
        run: python3 __qa_transfer__/prepare.py prepare
      - name: Scope the Books assertion without dropping its validation contract
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = 'tests/browser/test_product_journeys.py'
          source = Path(path)
          text = source.read_text()
          start = text.index('    def test_library_query_limit_recovers_to_a_real_passage(')
          end = text.index('\n    def ', start + 5)
          old = text[start:end]
          assert old.count("self.page.get_by_role('alert')") == 2
          assert old.count('        self.library_search(boundary)\n') == 1
          new = old.replace('        self.library_search(boundary)\n', "        self.library_search(boundary)\n        results = self.page.get_by_label('Library search results', exact=True)\n")
          new = new.replace("self.page.get_by_role('alert')", "results.get_by_role('alert')")
          data = (text[:start] + new + text[end:]).encode()
          sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert sha == '64ac9bcfbc41442b4419df26b904507e112bcc08', sha
          source.write_bytes(data)
          root = Path('/tmp/search-quality-prepared')
          (root / path).write_bytes(data)
          manifest = json.loads((root / 'manifest.json').read_text())
          for row in manifest['files']:
              if row['path'] == path:
                  row['sha'] = sha
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          PY
      - name: Upload verified immutable source blobs
        env:
          SOURCE_BLOB_TOKEN: ${{ github.token }}
        run: python3 __qa_transfer__/prepare.py publish-blobs
      - run: pnpm --dir apps/web exec svelte-kit sync
      - name: Complete production search regressions
        run: |
          set -o pipefail
          node --experimental-strip-types --test tests/unit/reader-search-worker.test.mjs tests/unit/library-search-excerpts.test.mjs 2>&1 | tee /tmp/search-quality-prepared/units.log
      - name: Application types
        run: |
          set -o pipefail
          pnpm --dir apps/web check 2>&1 | tee /tmp/search-quality-prepared/types.log
      - name: Repository lint
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee /tmp/search-quality-prepared/lint.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-search-quality
          path: /tmp/search-quality-prepared
          include-hidden-files: true
          retention-days: 7
