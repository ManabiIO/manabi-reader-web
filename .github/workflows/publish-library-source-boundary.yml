name: Publish WebDAV source boundary repair
on:
  push:
    branches: [feat/local-library-migration-webdav-search-20260924]
    paths: ['.github/workflows/publish-library-source-boundary.yml']
permissions:
  contents: read
jobs:
  apply:
    if: >-
      github.repository == 'ManabiIO/manabi-reader-web' && github.event.head_commit.message == 'chore: publish WebDAV source boundary repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify and apply the source-only repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          encoded = ''
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 12975
          assert hashlib.sha256(patch).hexdigest() == '9398b37a4cf409ca2666cd0890516dc4b84e2d0219b71509bd1424478ee5718e'
          Path('/tmp/source-boundary.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/source-boundary.patch
          git apply --index /tmp/source-boundary.patch
          git diff --cached --check
      - name: Publish without overwriting concurrent work
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          branch=feat/local-library-migration-webdav-search-20260924
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: order WebDAV source changes through the final sync commit'
          git push origin "HEAD:refs/heads/$branch"
