name: Books library
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'tests/browser/**'
      - 'tests/unit/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/books-library.yml'
  push:
    branches: [main]
    # Every exact main SHA needs a release qualification, even build-config-only changes.
permissions:
  contents: read
concurrency:
  group: books-library-${{ github.ref }}
  cancel-in-progress: true
jobs:
  library:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - name: Production models and file-operation fault tests
        run: |
          mkdir -p artifacts/library
          git rev-parse HEAD > artifacts/library/commit.txt
          set -o pipefail
          node --experimental-strip-types --test tests/unit/library*.test.mjs 2>&1 | tee artifacts/library/units.log
      - name: Build static application
        env:
          BASE_PATH: /reader-web
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee artifacts/library/build.log
      - name: Actual browser, storage and file-operation acceptance
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium webkit
          set +e
          status=0
          for engine in chromium webkit; do
            mkdir -p artifacts/library/$engine
            cases=BooksLibraryBrowser
            if [ "$engine" = chromium ]; then cases="$cases BooksLibraryFilesystem"; fi
            LIBRARY_BROWSER=$engine python tests/browser/test_books_library.py $cases 2>&1 | tee artifacts/library/$engine/results.log
            result=${PIPESTATUS[0]}
            if [ "$result" -ne 0 ]; then status=1; fi
            LIBRARY_BROWSER=$engine python tests/browser/test_want_to_read.py 2>&1 | tee artifacts/library/$engine/want-to-read.log
            result=${PIPESTATUS[0]}
            if [ "$result" -ne 0 ]; then status=1; fi
            PICKS_BROWSER=$engine python tests/browser/test_editors_picks.py 2>&1 | tee artifacts/library/$engine/editors-picks.log
            result=${PIPESTATUS[0]}
            if [ "$result" -ne 0 ]; then status=1; fi
            LIBRARY_BROWSER=$engine python tests/browser/test_library_sync.py 2>&1 | tee artifacts/library/$engine/organization-sync.log
            result=${PIPESTATUS[0]}
            if [ "$result" -ne 0 ]; then status=1; fi
            LIBRARY_BROWSER=$engine python tests/browser/test_cloud_series_replay.py 2>&1 | tee artifacts/library/$engine/cloud-series-replay.log
            result=${PIPESTATUS[0]}
            if [ "$result" -ne 0 ]; then status=1; fi
            LIBRARY_BROWSER=$engine python tests/browser/test_library_cloud_relocation.py 2>&1 | tee artifacts/library/$engine/cloud-relocation.log
            result=${PIPESTATUS[0]}
            if [ "$result" -ne 0 ]; then status=1; fi
            if [ -d test-results ]; then mv test-results artifacts/library/$engine/screenshots; fi
          done
          LIBRARY_BROWSER=chromium python tests/browser/test_library_preview_cache.py 2>&1 | tee artifacts/library/preview-cache.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then status=1; fi
          if [ -d test-results ]; then mv test-results artifacts/library/preview-cache-screenshots; fi
          git diff --exit-code > artifacts/library/post-test-source.diff
          result=$?
          if [ "$result" -ne 0 ]; then status=1; fi
          exit "$status"
      # These enabled data-safety features must qualify the final main SHA, not
      # only a PR merge ref. Reuse this job's app, dependencies and browsers.
      - name: Required Local Library and Shared TTU safety
        env:
          PYTHONPATH: tests/browser
        run: |
          set -euo pipefail
          for engine in chromium webkit; do
            LIBRARY_BROWSER=$engine python -m unittest test_local_library_features test_local_library_review test_local_library_refinement test_local_library_lifecycle test_library_deletion -v 2>&1 | tee artifacts/library/$engine/local-safety.log
            if [ -d test-results ]; then mv test-results artifacts/library/$engine/local-safety-results; fi
          done
          LIBRARY_BROWSER=chromium python -m unittest test_books_library.BooksLibraryFilesystem.test_external_relocation_rebinds_content_identity_and_presentation test_books_library.BooksLibraryFilesystem.test_relocated_book_read_cannot_navigate_after_browser_back -v 2>&1 | tee artifacts/library/local-open-lifetime.log
          if [ -d test-results ]; then mv test-results artifacts/library/local-open-lifetime-results; fi
          # Retain each script's explicit suite selection; unittest discovery
          # would also collect inherited/imported cases in these two modules.
          python tests/browser/test_shared_ttu.py 2>&1 | tee artifacts/library/shared-roundtrip.log
          python tests/browser/test_shared_safety.py 2>&1 | tee artifacts/library/shared-safety.log
          LIBRARY_BROWSER=chromium python -m unittest test_reader_integration -v 2>&1 | tee artifacts/library/shared-integration.log
          if [ -d test-results ]; then mv test-results artifacts/library/shared-safety-results; fi
          git diff --exit-code > artifacts/library/post-safety-source.diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: books-library-evidence
          path: |
            artifacts/library
            test-results
          retention-days: 7
          if-no-files-found: error
