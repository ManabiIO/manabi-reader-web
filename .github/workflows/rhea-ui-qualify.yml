name: Rhea complete UI qualification
on:
  push:
    branches: [research/rhea-toolchain-20260920]
    paths: ['.github/workflows/rhea-ui-qualify.yml', '.github/rhea-ui.*']
permissions:
  contents: write
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: rhea-toolchain-source
          run-id: 35490600815
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/upstream
      - name: Apply exact reviewed implementation on the committed foundation
        run: |
          python3 - <<'PY'
          import pathlib,lzma,json,hashlib,subprocess,zipfile,re
          raw=lzma.decompress(b''.join(pathlib.Path(f'.github/rhea-ui.{i}').read_bytes() for i in range(3)))
          assert hashlib.sha256(raw).hexdigest()=='a8a191ea8fb2fd08013ddb8dd1871b90bccbccf7afdc41a1266d168b45f65cbf'
          scripts=json.loads(raw)
          subprocess.run(['git','checkout','7945125db2a894f0bf22c3994a3b15840ab58fc4'],check=True)
          with zipfile.ZipFile('/tmp/rhea-toolchain-source.zip','w') as z:
              z.write('/tmp/upstream/upstream-source.json','upstream-source.json')
          root=str(pathlib.Path.cwd())
          for script in scripts:
              content=script['content'].replace('/mnt/data/manabi-reader-web',root).replace('/mnt/data/rhea-toolchain-source.zip','/tmp/rhea-toolchain-source.zip')
              exec(compile(content,script['name'],'exec'),{})
          for route in ['connections','shared-library','import-ttu']:
              p=pathlib.Path('apps/web/src/routes')/route/'+page.svelte'
              p.write_text(re.sub(r'</button\s*>','</Button>',p.read_text()))
          for p in pathlib.Path('tests/browser').glob('*.py'):compile(p.read_text(),str(p),'exec')
          PY
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - name: Format and retain exact source before diagnostics
        run: |
          mkdir -p /tmp/rhea-ui
          python3 - <<'PY'
          import json,pathlib,subprocess
          names=sorted(set(subprocess.check_output(['git','ls-files','--modified','--others','--exclude-standard'],text=True).splitlines()))
          assert all(n.startswith(('apps/web/','tests/','test/','docs/','.github/workflows/appearance.yml')) or n=='pnpm-lock.yaml' for n in names),names
          fmt=[n for n in names if pathlib.Path(n).is_file() and pathlib.Path(n).suffix in {'.ts','.js','.mjs','.cjs','.json','.svelte','.css','.scss','.md','.yml'} and not n.endswith('palettes.scss')]
          with open('/tmp/rhea-ui/format.log','w') as log:result=subprocess.run(['pnpm','exec','prettier','--write',*fmt],stdout=log,stderr=subprocess.STDOUT)
          pathlib.Path('/tmp/rhea-ui/format.status').write_text(str(result.returncode))
          source=[{'path':n,'content':pathlib.Path(n).read_text() if pathlib.Path(n).is_file() else None} for n in names]
          pathlib.Path('/tmp/rhea-ui/source.json').write_text(json.dumps(source))
          pathlib.Path('/tmp/rhea-ui/base.txt').write_text('7945125db2a894f0bf22c3994a3b15840ab58fc4')
          PY
      - name: Lint, types, unit tests and production build
        id: static
        run: |
          set +e
          pnpm exec eslint . > /tmp/rhea-ui/lint.log 2>&1; echo $? > /tmp/rhea-ui/lint.status
          node tools/appearance/lint.mjs > /tmp/rhea-ui/components.log 2>&1; echo $? > /tmp/rhea-ui/components.status
          pnpm --dir apps/web check > /tmp/rhea-ui/types.log 2>&1; echo $? > /tmp/rhea-ui/types.status
          node --experimental-strip-types --test tests/unit/*.test.mjs test/reader/typography.test.mjs > /tmp/rhea-ui/units.log 2>&1; echo $? > /tmp/rhea-ui/units.status
          BASE_PATH=/Reader-Web pnpm build > /tmp/rhea-ui/build.log 2>&1; status=$?; echo $status > /tmp/rhea-ui/build.status
          exit $status
      - name: Real Chromium and WebKit interaction and regression tests
        if: steps.static.outcome == 'success'
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium webkit
          for engine in chromium webkit; do
            mkdir -p /tmp/rhea-ui/$engine
            set +e
            APPEARANCE_BROWSER=$engine python tests/browser/test_rhea_ui.py > /tmp/rhea-ui/$engine/results.log 2>&1
            echo $? > /tmp/rhea-ui/$engine/test.status
            set -e
            if [ -d test-results ]; then mv test-results /tmp/rhea-ui/$engine/screenshots; fi
          done
      - name: Retain reviewed tree without publishing commits or refs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import pathlib,json,urllib.request,os
          p=pathlib.Path('/tmp/rhea-ui/source.json')
          if not p.exists():raise SystemExit('Candidate did not reach source capture')
          tree=[]
          for f in json.loads(p.read_text()):
              item={'path':f['path'],'mode':'100644','type':'blob'}
              if f['content'] is None:item['sha']=None
              else:item['content']=f['content']
              tree.append(item)
          pathlib.Path('/tmp/rhea-ui/tree-input.json').write_text(json.dumps(tree))
          request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/trees',data=json.dumps({'base_tree':'5ef11845d5f9898030bfd7892a9591cd24db694b','tree':tree}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'},method='POST')
          with urllib.request.urlopen(request,timeout=60) as response:pathlib.Path('/tmp/rhea-ui/tree-sha.txt').write_text(json.load(response)['sha'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhea-complete-ui
          path: /tmp/rhea-ui
          retention-days: 7
      - name: Require every qualification status to pass
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib
          root=pathlib.Path('/tmp/rhea-ui')
          names=['format.status','lint.status','components.status','types.status','units.status','build.status','chromium/test.status','webkit/test.status']
          failures=[n for n in names if not (root/n).exists() or (root/n).read_text().strip()!='0']
          assert not failures,failures
          PY
