name: Rhea compiler diagnostics bundle
on:
  push:
    branches: [research/rhea-toolchain-20260920]
    paths: ['.github/workflows/rhea-local-toolchain.yml']
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7945125db2a894f0bf22c3994a3b15840ab58fc4
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture public compiler packages only
        run: |
          mkdir -p /tmp/compiler/bin
          cp "$(command -v node)" /tmp/compiler/bin/node
          cp package.json pnpm-lock.yaml /tmp/compiler/
          tar --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttf' --exclude='*.otf' --exclude='*.eot' --exclude='*.ttc' -czf /tmp/compiler/dependencies.tgz node_modules apps/web/node_modules
          sha256sum /tmp/compiler/bin/node /tmp/compiler/dependencies.tgz > /tmp/compiler/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rhea-compiler-only
          path: /tmp/compiler
          retention-days: 2
