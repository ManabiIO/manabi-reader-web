name: Parity development inputs
on:
  push:
    branches: [feat/library-parity-closeout-20260928]
    paths: [.github/workflows/parity-inputs.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 525a0790759177c102ed580eccb9175a1b8cc92c
          persist-credentials: false
      - name: Capture source
        run: |
          set -euo pipefail
          mkdir -p /tmp/parity-inputs
          git archive --format=tar HEAD | gzip > /tmp/parity-inputs/source.tar.gz
          git rev-parse HEAD > /tmp/parity-inputs/commit.txt
          cd /tmp/parity-inputs && sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: parity-source
          path: /tmp/parity-inputs
          retention-days: 1
          if-no-files-found: error
