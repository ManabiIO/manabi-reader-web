name: Notify production publication

on:
  workflow_run:
    workflows: ['Manabi Reader static build', 'Appearance', 'Books library']
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

# Wake on every required suite: the static build may finish before the browser
# suites. Do not cancel a successful notification on another suite's completion.
# Manabi independently rechecks all three exact-main runs before publication.
jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # workflow_run can access secrets. Never check out or execute source or
      # download artifacts here. Run only this trusted, inline readiness gate.
      - name: Require the complete exact-main qualification
        id: qualify
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            core.setOutput('qualified', 'false');
            const { owner, repo } = context.repo;
            const sha = context.payload.workflow_run.head_sha;
            const { data: main } = await github.rest.repos.getCommit({ owner, repo, ref: 'main' });
            if (main.sha !== sha) return;
            const workflows = ['manabi-reader-ci.yml', 'appearance.yml', 'books-library.yml'];
            for (const workflow_id of workflows) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, event: 'push', branch: 'main', head_sha: sha, per_page: 1
              });
              const run = data.workflow_runs?.[0];
              if (!run || run.head_sha !== sha || run.event !== 'push' || run.head_branch !== 'main' ||
                  run.head_repository?.full_name !== `${owner}/${repo}` ||
                  run.status !== 'completed' || run.conclusion !== 'success') {
                core.info(`Publication is waiting for ${workflow_id} on ${sha}.`);
                return;
              }
            }
            core.setOutput('qualified', 'true');
      - name: Wake the publication planner after frontend qualification
        if: steps.qualify.outputs.qualified == 'true'
        env:
          GH_TOKEN: ${{ secrets.MANABI_PUBLICATION_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Set MANABI_PUBLICATION_DISPATCH_TOKEN (Manabi repository Actions: write) to enable automatic publication. There is no polling fallback; run Reader Web static publication manually in lake-of-fire/manabi to recover.'
            exit 1
          fi
          gh api \
            --method POST \
            repos/lake-of-fire/manabi/actions/workflows/deploy-reader-web.yml/dispatches \
            -f ref=master
