name: Web reader lifetime qualification
on:
  pull_request:
    paths:
      - 'apps/web/src/reader-react/**'
      - 'apps/web/src/runtime/**'
      - 'apps/web/src/screens/routes/b.web.tsx'
      - 'apps/web/src/app/_layout.tsx'
      - 'tests/unit/web-*.test.mjs'
      - 'tests/browser/test_web_reader_lifetime.py'
      - '.github/workflows/web-reader-lifetime.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-reader-lifetime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: pnpm install --frozen-lockfile
      - name: Verify production navigation and history boundaries
        run: node --test --test-concurrency=2 tests/unit/navigation-intent.test.mjs tests/unit/web-history-broker.test.mjs tests/unit/web-reader-departure.test.mjs tests/unit/web-reader-lifetime.test.mjs tests/unit/web-navigation-qualification.test.mjs tests/unit/web-slot-qualification.test.mjs tests/unit/reader-session-close.test.mjs
      - name: Prepare reviewed assets
        run: |
          pnpm prepare:dictionary
          node scripts/prepare-expo.mjs
      - name: Export the actual qualification path
        env:
          BASE_PATH: /reader-web
          NODE_OPTIONS: --max-old-space-size=6144
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_QUALIFY_WEB_READER_LIFETIME: '1'
        run: |
          pnpm --dir apps/web exec expo export --platform web --output-dir build --max-workers 2
          node scripts/expo-postbuild.mjs
          node scripts/verify-expo-export.mjs --platform web --output apps/web/build --report apps/web/build/asset-qualification.json
      - uses: actions/upload-artifact@v4
        with:
          name: web-reader-lifetime-export
          path: apps/web/build/
          retention-days: 7
  browser:
    needs: export
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: web-reader-lifetime-export
          path: apps/web/build/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ordinary browser test dependencies
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Qualify actual reader save, retirement and history
        env:
          LIBRARY_BROWSER: ${{ matrix.engine }}
        run: |
          mkdir -p test-results
          set -o pipefail
          python tests/browser/test_web_reader_lifetime.py 2>&1 | tee test-results/lifetime-${{ matrix.engine }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-reader-lifetime-${{ matrix.engine }}-evidence
          path: test-results/
          retention-days: 7
