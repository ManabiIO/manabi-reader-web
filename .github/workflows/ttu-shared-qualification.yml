name: Shared TTU library qualification
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'tests/browser/**'
      - 'tests/unit/shared-library.test.mjs'
      - '.github/workflows/ttu-shared-qualification.yml'
permissions:
  contents: read
concurrency:
  group: ttu-shared-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - name: Verify committed source
        run: pnpm eslint .
      - name: Source isolation and TTU format contracts
        run: node --experimental-strip-types --test tests/unit/shared-library.test.mjs
      - run: pnpm --dir apps/web check
      - name: Build the actual static app
        env:
          BASE_PATH: /reader-web
        run: pnpm build
      - name: Install the browser
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium
      - name: Shared-library round-trip, ownership and integration acceptance
        run: python tests/browser/qualify_library_data_safety.py --suite shared
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ttu-shared-results
          path: test-results/
          retention-days: 3
