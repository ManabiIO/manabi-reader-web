name: EPUB migration test inputs
on:
  push:
    branches: [codex/epub-foliate-migration-20260925]
    paths: [.github/workflows/epub-migration-workspace.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Package unchanged repository assets and exact test runtime
        run: |
          python - <<'PY'
          import pathlib, shutil, subprocess, tarfile
          root = pathlib.Path.cwd()
          with tarfile.open('epub-migration-inputs.tar.gz', 'w:gz') as archive:
              for name in subprocess.check_output(['git', 'ls-files', '-z', 'apps/web/src/lib/assets/fonts']).decode().split('\0'):
                  if name and (root / name).is_file():
                      archive.add(root / name, arcname=name, recursive=False)
              archive.add(pathlib.Path(shutil.which('node')).resolve(), arcname='toolchain/node', recursive=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: epub-migration-inputs
          path: epub-migration-inputs.tar.gz
          retention-days: 1
