name: EPUB migration workspace
on:
  push:
    branches: [codex/epub-foliate-migration-20260925]
    paths: [.github/workflows/epub-migration-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: johnfactotum/foliate-js
          ref: 78914aef4466eb960965702401634c2cb348e9b1
          path: .epub-upstream
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install exact dependency graph for isolated regression testing
        run: pnpm install --frozen-lockfile
      - name: Package tracked source and test dependencies
        if: always()
        run: |
          python - <<'PY'
          import pathlib, subprocess, tarfile
          root = pathlib.Path.cwd()
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          excluded = {'.ttf', '.otf', '.woff', '.woff2', '.eot', '.pfb'}
          with tarfile.open('epub-migration-workspace.tar.gz', 'w:gz') as archive:
              for name in files:
                  path = root / name
                  if name and path.is_file() and path.suffix.lower() not in excluded:
                      archive.add(path, arcname=name, recursive=False)
              for path in [root / 'node_modules', *(root / 'apps').glob('*/node_modules'), *(root / 'packages').glob('*/node_modules')]:
                  if path.exists():
                      archive.add(path, arcname=str(path.relative_to(root)), filter=lambda entry: None if pathlib.PurePosixPath(entry.name).suffix.lower() in excluded else entry)
              for name in ['epub.js', 'epubcfi.js', 'paginator.js', 'overlayer.js', 'progress.js', 'README.md', 'LICENSE']:
                  path = root / '.epub-upstream' / name
                  if path.is_file():
                      archive.add(path, arcname='upstream-foliate/' + name, recursive=False)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epub-migration-workspace
          path: epub-migration-workspace.tar.gz
          retention-days: 1
