name: Local library features
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'tests/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/local-library-features.yml'
permissions:
  contents: read
concurrency:
  group: local-library-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - run: node --experimental-strip-types --test tests/unit/*.test.mjs
      - run: pnpm --dir apps/web check
      - run: pnpm build
      - run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium webkit
      - name: Chromium local-library acceptance
        env:
          PYTHONPATH: tests/browser
          LIBRARY_BROWSER: chromium
        run: python -m unittest test_local_library_features -v
      - name: WebKit local-library acceptance
        env:
          PYTHONPATH: tests/browser
          LIBRARY_BROWSER: webkit
        run: python -m unittest test_local_library_features -v
      - name: Record exact tested composition
        if: always()
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/commit.txt
          git ls-tree -r HEAD > test-results/tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-library-evidence
          path: test-results
          retention-days: 7
