name: Local library features
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'tests/**'
      - '.github/workflows/local-library-features.yml'
permissions:
  contents: read
concurrency:
  group: local-library-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - name: Package isolated qualification workspace
        run: |
          git rev-parse HEAD > qualification-commit.txt
          git ls-tree -r HEAD > qualification-tree.txt
          mkdir -p /tmp/reader-qualification
          cp "$(command -v node)" /tmp/reader-qualification/node
          tar --exclude=.git --exclude=apps/web/build -czf /tmp/reader-qualification/workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: local-library-qualification-workspace
          path: /tmp/reader-qualification
          retention-days: 1
      - run: node --experimental-strip-types --test tests/unit/*.test.mjs
      - run: pnpm --dir apps/web check
      - run: pnpm build
