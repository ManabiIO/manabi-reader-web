name: Apply final Appearance repair
on:
  push:
    branches: [feat/local-library-migration-webdav-search-20260924]
    paths: ['.github/final-appearance-repair.b64', '.github/workflows/apply-final-appearance-repair.yml']
permissions:
  contents: read
jobs:
  apply:
    if: >-
      github.repository == 'ManabiIO/manabi-reader-web' && github.event.head_commit.message == 'chore: stage final Appearance repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify and apply the frozen source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          encoded = Path('.github/final-appearance-repair.b64').read_text()
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 6302
          assert hashlib.sha256(patch).hexdigest() == '9f0ba9b59a232c1c52dafda315b2b8b553660f03cf7891d2f7481102a4997291'
          Path('/tmp/final-appearance.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/final-appearance.patch
          git apply --index /tmp/final-appearance.patch
          git diff --cached --check
      - name: Publish without overwriting concurrent work
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          branch=feat/local-library-migration-webdav-search-20260924
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve annotation focus and enlarged empty-state layout'
          git push origin "HEAD:refs/heads/$branch"
