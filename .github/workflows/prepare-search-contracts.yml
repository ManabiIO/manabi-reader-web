name: Prepare search test contract fixes
on:
  push:
    branches: [qa/search-contracts-20260928]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Upload immutable blobs only. The feature ref is updated separately.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8225d1d06ae552d37dd30378c6dbeb1b2ef579c9
          persist-credentials: false
      - name: Apply and validate the two exact test changes
        env:
          SOURCE_BLOB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, py_compile, subprocess
          from pathlib import Path
          from urllib.request import Request, urlopen
          base = '8225d1d06ae552d37dd30378c6dbeb1b2ef579c9'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == base
          output = Path('/tmp/search-contracts')
          output.mkdir()
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          rows = [
              ('tests/browser/test_books_library.py', '468b4d230a3087b45300865666026c7b5af5f516', '9518dfb2d602ddcd8c580f425d0f456c72b789d3'),
              ('tests/browser/test_control_refinement.py', '75fcce2c4ac4b07ff3e0052c91e1dcf750b41dd6', 'bbc16014c7f73edb1c04b73d7dbf9b998e9a43a7')
          ]
          records = []
          for name, before, after in rows:
              path = Path(name)
              data = path.read_bytes()
              assert blob(data) == before, name
              text = data.decode()
              if name.endswith('test_books_library.py'):
                  old = "            expect(self.page.get_by_text(f'{count} results', exact=True)).to_be_visible(timeout=15000)"
                  new = "            status = self.page.get_by_role('dialog').last.get_by_role('status')\n            expect(status).to_have_text(f\"{count} {'result' if count == 1 else 'results'}\", timeout=15000)"
              else:
                  old = "        self.page.keyboard.press('Escape')\n        expect(panel).to_have_count(0)\n        panel = self.open_tool('Search Book')\n        expect(panel.get_by_role('searchbox')).to_have_value('文章')"
                  new = "        self.page.keyboard.press('Escape')\n        # Escape belongs to the active input method; explicit dismissal still\n        # ends composition and must not disable the next real search.\n        expect(panel).to_be_visible()\n        expect(panel.get_by_role('searchbox')).to_be_focused()\n        panel.get_by_role('button', name='Close search', exact=True).click()\n        expect(panel).to_have_count(0)\n        panel = self.open_tool('Search Book')\n        expect(panel.get_by_role('searchbox')).to_have_value('文章')"
              assert text.count(old) == 1, name
              result = text.replace(old, new).encode()
              assert blob(result) == after, name
              path.write_bytes(result)
              py_compile.compile(str(path), doraise=True)
              (output / path.name).write_bytes(result)
              records.append({'path': name, 'before': before, 'sha': after})
          subprocess.run(['git', 'diff', '--check'], check=True)
          assert set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()) == {r[0] for r in rows}
          (output / 'review.patch').write_bytes(subprocess.check_output(['git', 'diff']))
          for row in records:
              data = Path(row['path']).read_bytes()
              request = Request('https://api.github.com/repos/ManabiIO/manabi-reader-web/git/blobs',
                  data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['SOURCE_BLOB_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == row['sha'], row['path']
          receipt = {'base': base, 'files': records}
          (output / 'manifest.json').write_text(json.dumps(receipt, indent=2))
          print(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-search-test-contracts
          path: /tmp/search-contracts
          retention-days: 7
