name: Apply reviewed snippet regression fixes
on:
  push:
    branches: [feat/cloud-backed-snippets]
    paths: ['.github/workflows/snippets-workspace.yml']
permissions:
  contents: write
concurrency:
  group: snippets-reviewed-source
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/snippets-implementation-20260928
          persist-credentials: true
      - name: Apply exact reviewed six-file delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,lzma,subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()=='aae970b6ee60b78fcb6da214fbd85fed3da11ecc', 'PR changed; review and rebase instead of overwriting'
          encoded=''
          raw=lzma.decompress(base64.b64decode(encoded,validate=True),memlimit=128*1024*1024)
          assert len(raw)==21589
          assert hashlib.sha256(raw).hexdigest()=='0310a45c746d2c17dd4cc6abcf8c73863e208fda0148e8c646e3865d25ff8e1a'
          expected={'apps/web/src/lib/snippets/route-load.ts','apps/web/src/lib/snippets/transfers.ts','apps/web/src/lib/snippets/workspace.svelte','test/snippets/browser.mjs','test/snippets/run.mjs','test/snippets/unit.test.mjs'}
          actual={r.split('\t',2)[2] for r in subprocess.check_output(['git','apply','--numstat','-'],input=raw).decode().splitlines()}
          assert actual==expected
          subprocess.run(['git','apply','--check','-'],input=raw,check=True)
          subprocess.run(['git','apply','--index','-'],input=raw,check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(snippets): fence draft routes and verify destination after state transfer'
          git push origin HEAD:refs/heads/codex/snippets-implementation-20260928
