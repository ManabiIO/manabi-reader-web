name: Apply reviewed discovery fixes
on:
  push:
    branches: [feat/cloud-backed-snippets]
    paths: ['.github/workflows/snippets-workspace.yml']
permissions:
  contents: write
concurrency:
  group: snippets-reviewed-source
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/snippets-implementation-20260928
          persist-credentials: true
      - name: Apply exact reviewed twelve-file delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,lzma,subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()=='842da7ed945c33bd611db9d054339d22d3e3795d', 'PR changed; review instead of overwriting'
          encoded=''
          raw=lzma.decompress(base64.b64decode(encoded,validate=True),memlimit=128*1024*1024)
          assert len(raw)==30133
          assert hashlib.sha256(raw).hexdigest()=='f7631e4b37777424fa1d5460188ef88f97c3638743a4d5a9d4b80faa7f039b27'
          expected={'apps/web/src/lib/library/catalog.ts','apps/web/src/lib/library/source-binding.ts','apps/web/src/lib/manabi/persistence.ts','apps/web/src/lib/manabi/runtime.svelte','apps/web/src/lib/snippets/destination-picker.svelte','apps/web/src/lib/snippets/discovery.ts','apps/web/src/lib/snippets/service.ts','apps/web/src/lib/snippets/storage.ts','apps/web/src/lib/snippets/workspace.svelte','test/snippets/browser.mjs','test/snippets/run.mjs','test/snippets/unit.test.mjs'}
          actual={r.split('\t',2)[2] for r in subprocess.check_output(['git','apply','--numstat','-'],input=raw).decode().splitlines()}
          assert actual==expected
          subprocess.run(['git','apply','--check','-'],input=raw,check=True)
          subprocess.run(['git','apply','--index','-'],input=raw,check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(snippets): isolate discovery from connection settings and guard source roots'
          git push origin HEAD:refs/heads/codex/snippets-implementation-20260928
