name: Recover snippet implementation
on:
  push:
    branches: [feat/cloud-backed-snippets]
    paths: ['.github/workflows/snippets-workspace.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Recover exact uploaded objects without modifying the repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,urllib.request
          out=pathlib.Path('/tmp/snippet-recovery');out.mkdir()
          chunks=[]
          shas=['c0512130ca5e21bf43e78fe07d718c872942b7a6','5e55d48abf1d5359d25041c89faa18920665903d','f99caa362c8a8f012ae83eb3535f342e84d99874']
          for n,sha in enumerate(shas):
              req=urllib.request.Request('https://api.github.com/repos/ManabiIO/manabi-reader-web/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response: item=json.load(response)
              data=base64.b64decode(item['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              (out/f'part-{n:02d}.txt').write_bytes(data);chunks.append(data)
          encoded=b''.join(chunks)
          dec=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=dec.decompress(base64.b64decode(encoded+b'='*((-len(encoded))%4)),max_length=2*1024*1024)
          (out/'recovered-prefix.patch').write_bytes(raw)
          (out/'manifest.json').write_text(json.dumps({'blobs':shas,'encodedBytes':len(encoded),'decompressedBytes':len(raw),'complete':dec.eof,'sha256':hashlib.sha256(raw).hexdigest()},indent=2))
          print((out/'manifest.json').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-snippet-implementation
          path: /tmp/snippet-recovery
          retention-days: 7
          if-no-files-found: error
