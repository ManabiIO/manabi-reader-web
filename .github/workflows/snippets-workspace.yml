name: Pinned snippet review source
on:
  push:
    branches: [feat/cloud-backed-snippets]
    paths: ['.github/workflows/snippets-workspace.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7d5c6729bc736cda3103b9911b120545da17baf8
          persist-credentials: false
      - name: Retain tracked source only
        run: |
          mkdir -p /tmp/snippet-review-source
          git archive --format=tar.gz HEAD > /tmp/snippet-review-source/source.tar.gz
          git ls-files -s > /tmp/snippet-review-source/manifest.txt
          git rev-parse HEAD > /tmp/snippet-review-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: snippets-pr-source
          path: /tmp/snippet-review-source
          retention-days: 1
          if-no-files-found: error
