name: Current snippet integration sources
on:
  push:
    branches: [feat/cloud-backed-snippets]
    paths: ['.github/workflows/snippets-workspace.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d0afc6fab0530c597e68b5345ab28ab138d16ac1
          fetch-depth: 0
          persist-credentials: false
      - name: Retain exact current-main integration delta
        run: |
          mkdir -p /tmp/snippet-current-main
          git diff --binary 329dcec43bcfeaadaf6b028182584214b0f37558 HEAD > /tmp/snippet-current-main/current-main.patch
          git rev-parse HEAD > /tmp/snippet-current-main/source-commit
          git ls-files -s > /tmp/snippet-current-main/source-manifest
          sha256sum /tmp/snippet-current-main/current-main.patch
      - uses: actions/upload-artifact@v4
        with:
          name: snippet-current-main
          path: /tmp/snippet-current-main
          retention-days: 7
          if-no-files-found: error
