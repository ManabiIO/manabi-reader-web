name: MOSS shared custody experiment
on:
  pull_request:
    paths:
      - 'tests/media/shared-custody-probe.py'
      - '.github/workflows/moss-shared-custody.yml'
permissions:
  contents: read
concurrency:
  group: moss-shared-custody-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - run: python tests/media/shared-custody-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moss-shared-custody-experiment
          path: test-results/media/shared-custody-probe.json
          if-no-files-found: error
          retention-days: 7
