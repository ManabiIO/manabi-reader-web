name: Book presentation browser
on:
  pull_request:
    paths:
      - 'apps/web/src/lib/preprocessing/**'
      - 'apps/web/src/lib/functions/book-data-loader/**'
      - 'apps/web/src/lib/functions/book-security/**'
      - 'test/preprocessing/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/book-presentation.yml'
  push:
    branches: [main, codex/manabi-web-preprocessing-r3]
    paths:
      - 'apps/web/src/lib/preprocessing/**'
      - 'apps/web/src/lib/functions/book-data-loader/**'
      - 'apps/web/src/lib/functions/book-security/**'
      - 'test/preprocessing/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/book-presentation.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Real sanitizer, source isolation and Blob URL ownership
        run: node test/preprocessing/presentation-browser.mjs
