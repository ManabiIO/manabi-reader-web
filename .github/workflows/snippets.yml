name: Portable snippets
on:
  pull_request:
    paths:
      [
        'apps/web/**',
        'test/snippets/**',
        'pnpm-lock.yaml',
        'eslint.config.js',
        '.github/workflows/snippets.yml'
      ]
  push:
    branches: [main]
    paths:
      [
        'apps/web/**',
        'test/snippets/**',
        'pnpm-lock.yaml',
        'eslint.config.js',
        '.github/workflows/snippets.yml'
      ]
permissions:
  contents: read
concurrency:
  group: snippets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  snippets:
    # This exact migration is qualified once in expo-migration.yml.
    if: >-
      !(github.repository == 'ManabiIO/manabi-reader-web' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'ManabiIO/manabi-reader-web' &&
        github.head_ref == 'feat/expo-android-web-migration') ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/feat/expo-android-web-migration')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6.1.0
        with: { version: '12.3.4' }
      - uses: actions/setup-node@v4
        with: { node-version: '24.21.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-expo.mjs
      - name: Document, IndexedDB, outbox and transfer regression tests
        shell: bash
        run: |
          mkdir -p test-results/snippets
          node test/snippets/run.mjs 2>&1 | tee test-results/snippets/unit.log
          node --experimental-strip-types --test tests/unit/*.test.mjs 2>&1 | tee test-results/snippets/regressions.log
      - name: Lint and typecheck
        shell: bash
        run: |
          pnpm exec eslint apps/web/src/lib/snippets/*.ts test/snippets/*.mjs
          pnpm exec eslint --config tools/appearance/eslint.config.mjs apps/web/src/lib/snippets/*.svelte apps/web/src/routes/snippets/+page.svelte
          pnpm exec prettier --check 'apps/web/src/lib/snippets/**/*' 'apps/web/src/routes/snippets/**/*' 'test/snippets/*'
          pnpm --dir apps/web check 2>&1 | tee test-results/snippets/types.log
      - name: Static production build
        shell: bash
        env: { BASE_PATH: /reader-web }
        run: pnpm build 2>&1 | tee test-results/snippets/build.log
      - name: Assembled production UI and native IndexedDB in both browser engines
        shell: bash
        run: |
          pnpm exec playwright install --with-deps chromium webkit
          PORT=4178 BASE_PATH=/reader-web node scripts/serve-expo.mjs > test-results/snippets/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if ! kill -0 "$server" 2>/dev/null; then
              cat test-results/snippets/server.log
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:4178/reader-web/snippets >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat test-results/snippets/server.log
            echo 'Expo static preview did not become ready' >&2
            exit 1
          fi
          for engine in chromium webkit; do
            SNIPPETS_BROWSER="$engine" SNIPPETS_SCREENSHOT="test-results/snippets/$engine.png" node test/snippets/browser.mjs 2>&1 | tee "test-results/snippets/$engine.log"
          done
      - name: Record exact source identity
        if: always()
        run: |
          mkdir -p test-results/snippets
          git rev-parse HEAD > test-results/snippets/commit.txt
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snippets-evidence-${{ github.sha }}
          path: test-results/snippets
          retention-days: 7
          if-no-files-found: error
