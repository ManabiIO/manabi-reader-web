name: Reader edition qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reader-edition-qualification
  cancel-in-progress: false
jobs:
  web:
    name: Reader edition qualification
    if: >-
      github.repository == 'ManabiIO/manabi-reader-web' &&
      github.event.repository.visibility == 'public' &&
      toJSON(github.event.repository.private) == 'false' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      READER_EDITION: manabitan
      BASE_PATH: /manabitan-reader
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:dictionary && node scripts/prepare-expo.mjs
      - run: pnpm --dir apps/web check
      - run: pnpm test:dictionary-boundary && pnpm test:edition
      - run: pnpm build
      - run: node scripts/verify-expo-export.mjs --platform web --output apps/web/build
      - run: python -m pip install 'playwright==1.63.0' && python -m playwright install --with-deps chromium webkit
      - run: python tests/browser/test_reader_editions.py
      # Qualification stays on its producing revision. No automatic publication,
      # private checkout, cache save or remote artifact upload occurs here.
