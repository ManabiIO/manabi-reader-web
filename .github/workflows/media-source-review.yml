name: Stage reviewed media source objects
# One-shot immutable-object transport. No checkout, package scripts, commits or ref writes.
# Removed by the final source publication commit.
on:
  push:
    branches: [codex/video-moss-media-v7-20260924]
    paths: [.github/workflows/media-source-review.yml]
permissions:
  contents: read
jobs:
  stage:
    if: github.repository == 'ManabiIO/manabi-reader-web'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '10846962211'
          run-id: '36094947183'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate
          merge-multiple: true
      - name: Stage only the verified immutable blobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto');
          (async()=>{
            const raw=fs.readFileSync('candidate/candidate.json');
            if(raw.length!==496173 || crypto.createHash('sha256').update(raw).digest('hex')!=='07b45d6f0e008ee64670dec7d91bd7ca29b666b2311f8a705f8d540f6b658e5f')throw Error('Candidate mismatch');
            const candidate=JSON.parse(raw);
            if(candidate.base!=='fbb4b9c907c57df799004db7396f3ac907d8415a'||candidate.files.length!==53)throw Error('Candidate identity mismatch');
            const seen=new Set();
            for(const f of candidate.files){
              if(seen.has(f.path)||f.path.includes('..')||!(f.path==='eslint.config.js'||f.path.startsWith('apps/web/src/lib/media/')||f.path.startsWith('apps/web/src/lib/manabi/media-')||f.path.startsWith('tests/media/')||f.path.startsWith('tools/media/')))throw Error('Unexpected source path');
              seen.add(f.path);
              const b=Buffer.from(f.content);
              if(crypto.createHash('sha256').update(b).digest('hex')!==f.sha256||crypto.createHash('sha1').update(Buffer.from(`blob ${b.length}\0`)).update(b).digest('hex')!==f.gitBlob)throw Error('Source hash mismatch');
            }
            for(const f of candidate.files){
              const response=await fetch('https://api.github.com/repos/ManabiIO/manabi-reader-web/git/blobs',{
                method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},
                body:JSON.stringify({content:Buffer.from(f.content).toString('base64'),encoding:'base64'})});
              if(!response.ok)throw Error(`Object upload failed (${response.status})`);
              const result=await response.json();if(result.sha!==f.gitBlob)throw Error('Stored object mismatch');
              console.log(`${f.path} ${result.sha}`);
            }
            console.log('Verified all 53 immutable source objects. No commit or ref was changed.');
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          JS
