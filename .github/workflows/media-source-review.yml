name: Media source review
# Temporary candidate generation only: no repository write permission or ref writes.
on:
  push:
    branches: [codex/video-moss-media-v7-20260924]
    paths: [.github/workflows/media-source-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - name: Prepare scoped source candidate and diagnostics
        run: |
          mkdir -p .cache/media-source-review
          node <<'JS'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const crypto = require('node:crypto');
          (async () => {
            const { ESLint } = require('eslint');
            const baseline = 'fc97b74c4a55ec0cfedbd7ba733f08e2a167e017';
            const paths = cp.execFileSync('git', ['diff', '--name-only', '--diff-filter=ACM', baseline, 'HEAD'], {encoding:'utf8'}).trim().split('\n').filter(p => /\.(?:[cm]?js|ts|svelte)$/.test(p));
            if (!paths.length || paths.length > 150 || paths.some(p => p.startsWith('/') || p.split('/').includes('..'))) throw new Error('Invalid source scope');
            const before = Object.fromEntries(paths.map(p => [p, crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')]));
            const eslint = new ESLint({fix:true});
            const results = await eslint.lintFiles(paths);
            await ESLint.outputFixes(results);
            const remaining = await new ESLint({fix:false}).lintFiles(paths);
            const diagnostics = remaining.flatMap(r => r.messages.map(m => ({path:r.filePath.replace(process.cwd()+'/', ''), ...m})));
            fs.writeFileSync('.cache/media-source-review/diagnostics.json', JSON.stringify(diagnostics,null,2));
            const changed = cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
            if (changed.some(p => !paths.includes(p))) throw new Error('Unscoped modification');
            const files = changed.map(path => {
              const bytes=fs.readFileSync(path);
              return {path,before:before[path],sha256:crypto.createHash('sha256').update(bytes).digest('hex'),gitBlob:crypto.createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`)).update(bytes).digest('hex'),content:bytes.toString('utf8')};
            });
            const candidate = {base:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),files};
            fs.writeFileSync('.cache/media-source-review/candidate.json',JSON.stringify(candidate));
            fs.writeFileSync('.cache/media-source-review/review.diff',cp.execFileSync('git',['diff','--no-ext-diff'],{encoding:'utf8'}));
            console.log(JSON.stringify({changed:files.length,remaining:diagnostics.filter(m=>m.severity===2)},null,2));
          })().catch(error=>{console.error(error);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: media-reviewed-source-candidate
          path: .cache/media-source-review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Check installed candidate application
        run: pnpm --dir apps/web check
      - name: Build candidate application
        run: pnpm --dir apps/web build
