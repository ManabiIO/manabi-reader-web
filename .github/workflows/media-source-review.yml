name: Media source review
# Final candidate generation only. No commits, refs, deployment or hosted inference.
on:
  push:
    branches: [codex/video-moss-media-v7-20260924]
    paths: [.github/workflows/media-source-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '10846826205'
          run-id: '36094707607'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .cache/reviewed-input
          merge-multiple: true
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - name: Finalize the checksum-reviewed source
        run: |
          node <<'JS'
          const fs=require('node:fs'),cp=require('node:child_process'),crypto=require('node:crypto');
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          (async()=>{
            const raw=fs.readFileSync('.cache/reviewed-input/candidate.json');
            if(hash(raw)!=='6d90624868d8f671655b8495b3ecc2770e3078010ab6710dbd93ad6c1d153c0e')throw Error('Candidate checksum mismatch');
            const candidate=JSON.parse(raw);
            if(candidate.base!=='5b18d8f1a448c29880e5a2beef3993bbe20c3b7a'||candidate.files.length!==53)throw Error('Candidate identity mismatch');
            for(const f of candidate.files){
              if(hash(fs.readFileSync(f.path))!==f.before||hash(Buffer.from(f.content))!==f.sha256)throw Error('Changed source '+f.path);
              fs.writeFileSync(f.path,f.content);
            }
            function replace(path,from,to,count=1){const text=fs.readFileSync(path,'utf8');if(text.split(from).length!==count+1)throw Error('Ambiguous edit '+path);fs.writeFileSync(path,text.split(from).join(to));}
            replace('eslint.config.js',"          MessageChannel: 'readonly'","          MessageChannel: 'readonly',\n          ReadableStream: 'readonly',\n          EventTarget: 'readonly',\n          MessageEvent: 'readonly',\n          Event: 'readonly',\n          navigator: 'readonly'");
            replace('tests/media/core.test.mjs','  identify,\n','');
            replace('tests/media/core.test.mjs','.map(({ id, ...c }) => c)','.map((cue) => { const copy = { ...cue }; delete copy.id; return copy; })',2);
            replace('tests/media/lifecycle.test.mjs','import { localSource, identify, streamedRange }','import { identify, streamedRange }');
            replace('tests/media/integration-boundaries.test.mjs','  let latest,\n    reads = 0,\n    writes = 0;','  let latest,\n    writes = 0;');
            replace('tests/media/integration-boundaries.test.mjs','        reads++;\n','');
            replace('tests/media/transaction-double.mjs','    const factory = this;','    // eslint-disable-next-line @typescript-eslint/no-this-alias -- Keep the factory distinct from the mock connection receiver.\n    const factory = this;');
            const path='tests/media/dom-browser.py';
            let lines=fs.readFileSync(path,'utf8').split('\n'),start=lines.findIndex(s=>s.startsWith('  assert page.evaluate'));
            const end=lines.findIndex((s,i)=>i>start&&s.startsWith('        case(\'dark appearance'));
            if(start<0||end<=start)throw Error('Contrast test indentation range missing');
            for(let i=start;i<end;i++)lines[i]='          '+lines[i];
            fs.writeFileSync(path,lines.join('\n'));
            const {ESLint}=require('eslint'),eslint=new ESLint({fix:true});
            const paths=candidate.files.map(f=>f.path).filter(p=>/\.(?:[cm]?js|ts)$/.test(p)&&p!=='eslint.config.js');
            await ESLint.outputFixes(await eslint.lintFiles(paths));
            const prettier=require('prettier'),configuration=await prettier.resolveConfig('eslint.config.js');
            fs.writeFileSync('eslint.config.js',await prettier.format(fs.readFileSync('eslint.config.js','utf8'),{...configuration,filepath:'eslint.config.js'}));
            const report=await new ESLint({fix:false}).lintFiles(paths);
            const diagnostics=report.flatMap(r=>r.messages.map(m=>({path:r.filePath.replace(process.cwd()+'/',''),...m})));
            fs.mkdirSync('.cache/media-source-review',{recursive:true});
            fs.writeFileSync('.cache/media-source-review/diagnostics.json',JSON.stringify(diagnostics,null,2));
            const changed=cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
            if(changed.some(p=>!candidate.files.some(f=>f.path===p)))throw Error('Unscoped change');
            for(const f of candidate.files){const b=fs.readFileSync(f.path);f.content=b.toString('utf8');f.sha256=hash(b);f.gitBlob=crypto.createHash('sha1').update(Buffer.from(`blob ${b.length}\0`)).update(b).digest('hex');}
            candidate.base=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
            fs.writeFileSync('.cache/media-source-review/candidate.json',JSON.stringify(candidate));
            fs.writeFileSync('.cache/media-source-review/review.diff',cp.execFileSync('git',['diff','--no-ext-diff'],{encoding:'utf8'}));
            console.log(JSON.stringify({changed:changed.length,diagnostics},null,2));
            if(diagnostics.some(m=>m.severity===2))process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - name: Validate Python UI harness syntax
        run: python -m py_compile tests/media/dom-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-reviewed-source-candidate
          path: .cache/media-source-review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Check installed application
        run: pnpm --dir apps/web check
      - name: Build application
        run: pnpm --dir apps/web build
      - name: Run core media tests
        run: pnpm exec node tools/media/test.mjs
      - name: Run normal repository lint
        run: pnpm check
