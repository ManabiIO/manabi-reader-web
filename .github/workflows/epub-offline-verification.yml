name: EPUB offline verification workspace
on:
  push:
    branches: [codex/epub-offline-verification-20260926]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 92a53bfe9452ea0a3ad81824934113b369d82651
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: pnpm install --frozen-lockfile
      - name: Package public source and installed build dependencies for isolated tests
        run: |
          mkdir -p /tmp/epub-verification
          git archive HEAD | gzip > /tmp/epub-verification/source.tar.gz
          tar -czf /tmp/epub-verification/dependencies.tar.gz node_modules apps/web/node_modules
          cp "$(command -v node)" /tmp/epub-verification/node
          git rev-parse HEAD > /tmp/epub-verification/source-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: epub-verification-92a53bfe
          path: /tmp/epub-verification
          retention-days: 1
          compression-level: 0
