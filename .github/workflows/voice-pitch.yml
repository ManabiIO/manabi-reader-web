name: Optional voice pitch
on:
  pull_request:
    paths:
      - 'apps/web/src/lib/features/whispersync/**'
      - 'apps/web/src/service-worker.ts'
      - 'apps/web/package.json'
      - 'pnpm-lock.yaml'
      - 'test/pitch/**'
      - 'tests/browser/test_voice_pitch.py'
      - '.github/workflows/voice-pitch.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice-pitch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    # This exact migration is qualified once in expo-migration.yml.
    if: >-
      !(github.repository == 'ManabiIO/manabi-reader-web' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'ManabiIO/manabi-reader-web' &&
        github.head_ref == 'feat/expo-android-web-migration') ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/feat/expo-android-web-migration')))
    name: Pitch ${{ matrix.browser }}
    # Headless Linux WebKit reports play while its WAV media clock stays at 0;
    # macOS WebKit exercises the actual Safari media pipeline.
    runs-on: ${{ matrix.browser == 'webkit' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - name: Deterministic estimator and lifetime regressions
        run: node test/pitch/run.mjs --emit=test-results/pitch-modules
      - name: Install native browser
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Provide a native output device on the headless runner
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=pitch_ci rate=48000
          pactl set-default-sink pitch_ci
          pactl info
      - name: Native audio and lazy worker
        run: |
          set -o pipefail
          python test/pitch/browser.py test-results/pitch-modules --browser ${{ matrix.browser }} 2>&1 | tee test-results/pitch-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-pitch-${{ matrix.browser }}
          path: test-results/
          retention-days: 3
  application:
    # This exact migration is qualified once in expo-migration.yml.
    if: >-
      !(github.repository == 'ManabiIO/manabi-reader-web' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'ManabiIO/manabi-reader-web' &&
        github.head_ref == 'feat/expo-android-web-migration') ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/feat/expo-android-web-migration')))
    name: Pitch actual app and appearance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-expo.mjs
      - run: pnpm --dir apps/web check
      - name: Build the committed application
        env:
          BASE_PATH: /reader-web
        run: pnpm build
      - name: Install native browser and audio output
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=pitch_ci rate=48000
          pactl set-default-sink pitch_ci
      - name: Real transcript, lazy download, playback, light and dark
        run: python tests/browser/test_voice_pitch.py
      - name: Check formatting and retain an actionable patch
        if: always()
        run: |
          mkdir -p test-results
          pnpm exec prettier --write 'apps/web/src/lib/features/whispersync/pitch/*.{ts,svelte}' 'test/pitch/*.mjs' > test-results/pitch-format.log
          git diff --binary > test-results/pitch-format.patch
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-pitch-application
          path: |
            test-results/
            apps/web/src/lib/features/whispersync/pitch/
            test/pitch/*.mjs
          retention-days: 3
