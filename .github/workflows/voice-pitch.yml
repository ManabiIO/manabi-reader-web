name: Optional voice pitch
on:
  pull_request:
    paths:
      - 'apps/web/src/lib/features/whispersync/**'
      - 'apps/web/src/service-worker.ts'
      - 'test/pitch/**'
      - '.github/workflows/voice-pitch.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice-pitch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  formatting:
    name: Pitch formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Produce formatter patch without changing the branch
        run: |
          mkdir -p test-results
          pnpm exec prettier --write 'apps/web/src/lib/features/whispersync/pitch/*.{ts,svelte}' 'test/pitch/*.mjs' apps/web/src/service-worker.ts
          git diff --binary > test-results/pitch-format.patch
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-pitch-formatting
          path: |
            test-results/pitch-format.patch
            apps/web/src/lib/features/whispersync/pitch/
            apps/web/src/service-worker.ts
            test/pitch/*.mjs
          retention-days: 3
  native:
    name: Pitch ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Deterministic estimator and lifetime regressions
        run: node test/pitch/run.mjs --emit=test-results/pitch-modules
      - name: Install native browser
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Provide a native output device on the headless runner
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=pitch_ci rate=48000
          pactl set-default-sink pitch_ci
          pactl info
      - name: Native audio and lazy worker
        run: |
          set -o pipefail
          python test/pitch/browser.py test-results/pitch-modules --browser ${{ matrix.browser }} 2>&1 | tee test-results/pitch-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-pitch-${{ matrix.browser }}
          path: test-results/
          retention-days: 3
