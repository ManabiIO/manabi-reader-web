name: Prepare verified Reader test-source correction
on:
  push:
    branches: [codex/reader-closeout-publish-20260925]
    paths: [.github/workflows/reader-closeout-test-source.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 15ffc65ec99bc9d426e3cab80aca12063fe915b3
          path: preparation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: dee56fb4d5b2f5bc7d1f69f04542fe7442f0e401
          path: candidate
          persist-credentials: false
      - name: Repeat the exact pinned and checksum-verified source preparation
        run: |
          python -m pip install PyYAML==6.0.2
          python - <<'PY'
          import pathlib, subprocess, yaml
          preparation = yaml.safe_load(pathlib.Path('preparation/.github/workflows/reader-closeout-continue-publish.yml').read_text())
          step = preparation['jobs']['candidate']['steps'][1]
          assert step['name'] == 'Repair drifted fixture paths without changing assertions'
          subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', step['run']], cwd='candidate', check=True)
          PY
      - name: Publish source-only candidate; workflow changes require the authorized GitHub tool
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree .github/workflows/ttu-upstream-portability.yml
          ! git diff --cached --name-only | grep '^.github/'
          git diff --cached --check
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'Repair stale publication paths in integrated browser fixtures and guard against regressions' | git commit-tree "$tree" -p dee56fb4d5b2f5bc7d1f69f04542fe7442f0e401)
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin "$commit:refs/heads/codex/reader-closeout-path-candidate-20260925"
          printf 'commit=%s\ntree=%s\n' "$commit" "$tree" | tee /tmp/candidate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reader-closeout-test-source-candidate
          path: /tmp/candidate.txt
          retention-days: 1
