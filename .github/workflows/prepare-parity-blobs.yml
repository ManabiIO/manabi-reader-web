name: Prepare parity integration blobs
on:
  push:
    branches: [chore/library-parity-blob-stage-20260928]
    paths: [.github/workflows/prepare-parity-blobs.yml]
permissions:
  contents: write
concurrency:
  group: parity-integration-blob-preparation
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'ManabiIO/manabi-reader-web'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 77947ea646390296418d9ef73a3c331f1c1057a2
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const {execFileSync} = require('node:child_process');
            const git = args => execFileSync('git', args, {encoding:'utf8', maxBuffer:2*1024*1024}).trim();
            const assert = (v, m) => { if (!v) throw new Error(m); };
            const hash = (kind, b) => crypto.createHash(kind).update(b).digest('hex');
            const blobHash = b => hash('sha1', Buffer.concat([Buffer.from(`blob ${b.length}\0`),b]));
            assert(context.ref === 'refs/heads/chore/library-parity-blob-stage-20260928', 'Unexpected source branch');
            assert(git(['rev-parse','HEAD']) === '77947ea646390296418d9ef73a3c331f1c1057a2', 'Wrong source commit');
            assert(git(['rev-parse','HEAD^{tree}']) === 'f21c5752681cca628869bd21478b1b6642a8da8b', 'Wrong source tree');
            const chunks = [['85b0da2a814856bc0fe41a2a3f2d7ab566e8a553',8192],['2e1e548496fa96556df8ed79a87a29c7a3b31614',8192],['c9c70dd71e1a7d82a01b4970156d237803b4bb2f',8192],['d5aa117b0ed2f19e149b737b076f192731ea291d',8192],['1e5622f36fea4d4bbe2a17243c02d99bc977c757',3160]];
            const bytes = [];
            for (const [sha,size] of chunks) {
              const r = (await github.rest.git.getBlob({...context.repo, file_sha:sha})).data;
              assert(r.encoding === 'base64', 'Unexpected encoding');
              const b = Buffer.from(r.content,'base64');
              assert(b.length === size && blobHash(b) === sha, 'Chunk integrity failure'); bytes.push(b);
            }
            const packed = Buffer.concat(bytes);
            assert(hash('sha256',packed) === '8949a2fc7169e53ec7a2f84308550c35a570fcc660c0bfd899772c0656a76ad1', 'Packed digest mismatch');
            fs.writeFileSync('/tmp/parity-delta.xz',packed);
            execFileSync('python3',['-c',"import lzma,pathlib; d=lzma.LZMADecompressor(); b=d.decompress(pathlib.Path('/tmp/parity-delta.xz').read_bytes(),max_length=1048576); assert d.eof and not d.unused_data; pathlib.Path('/tmp/parity-delta.patch').write_bytes(b)"]);
            assert(hash('sha256',fs.readFileSync('/tmp/parity-delta.patch')) === 'b2b22dfcad8ad9c4102490730eeeb388a93b0e09b8b7dbdec0bb5de3e86c6a87', 'Patch digest mismatch');
            git(['apply','--check','/tmp/parity-delta.patch']); git(['apply','--index','/tmp/parity-delta.patch']);
            assert(git(['write-tree']) === '5b93984e22df191eefe053d74a0aaa4e7ca05e92', 'Integrated tree mismatch');
            const paths = git(['diff','--cached','--name-only','-z']).split('\0').filter(Boolean);
            assert(paths.length === 28, 'Unexpected changed-path count');
            const manifest = [];
            for (const path of paths) {
              assert(/^(apps\/web\/|tests\/|docs\/|\.github\/workflows\/books-library\.yml$)/.test(path), `Unexpected path ${path}`);
              const index = /^(100644|100755) ([a-f0-9]{40}) 0\t/.exec(git(['ls-files','--stage','--',path]));
              assert(!!index,'Unsupported entry');
              const content = fs.readFileSync(path);
              assert(blobHash(content) === index[2], 'Working byte mismatch');
              const blob = (await github.rest.git.createBlob({...context.repo,content:content.toString('base64'),encoding:'base64'})).data;
              assert(blob.sha === index[2], 'Uploaded blob mismatch');
              manifest.push({path,mode:index[1],type:'blob',sha:blob.sha});
            }
            fs.mkdirSync('/tmp/parity-result',{recursive:true});
            fs.writeFileSync('/tmp/parity-result/entries.json',JSON.stringify(manifest,null,2));
            fs.writeFileSync('/tmp/parity-result/tree.txt','5b93984e22df191eefe053d74a0aaa4e7ca05e92\n');
            core.info(`VERIFIED_BLOBS=${manifest.length}`);
            await core.summary.addHeading('Verified blob preparation').addRaw('Only immutable blobs were uploaded. No tree, commit or ref mutation was attempted.\n').write();
      - uses: actions/upload-artifact@v4
        with:
          name: parity-integration-blobs
          path: /tmp/parity-result
          retention-days: 1
          if-no-files-found: error
