name: Publish WebDAV consent boundary qualification
on:
  push:
    branches: [feat/local-library-migration-webdav-search-20260924]
    paths: ['.github/workflows/publish-library-consent-boundary.yml']
permissions:
  contents: read
jobs:
  apply:
    if: >-
      github.repository == 'ManabiIO/manabi-reader-web' && github.event.head_commit.message == 'chore: publish WebDAV consent boundary qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify and apply the reviewed source-only patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          encoded = ''
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 9928
          assert hashlib.sha256(patch).hexdigest() == '342fb6f834271489102ea488df5a7ccaac2091e0e10de5e75b9a70bfbb698fa9'
          Path('/tmp/consent-boundary.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/consent-boundary.patch
          git apply --index /tmp/consent-boundary.patch
          git diff --cached --check
      - name: Publish without overwriting concurrent work
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          branch=feat/local-library-migration-webdav-search-20260924
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep WebDAV connection identity immutable and revoke write consent atomically'
          git push origin "HEAD:refs/heads/$branch"
