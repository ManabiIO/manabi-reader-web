name: Search overflow diagnostic
on:
  push:
    branches: [review/search-overflow-diagnostic-20260929]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - name: Build enabled application
        env:
          BASE_PATH: /reader-web
          VITE_ENABLE_VIDEO_LEARNING: 'true'
        run: pnpm build
      - name: Install Chromium
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium
      - name: Run overflow cases only
        env:
          LIBRARY_BROWSER: chromium
        run: |
          python tests/browser/test_unified_search.py \
            UnifiedSearch.test_real_local_dictionary_uses_raw_input_and_bounded_previews \
            UnifiedSearch.test_unified_search_reflows_at_200_percent_text_on_short_phone
