name: Snippet integrity source
on:
  push:
    branches: [codex/snippets-integrity-review-20260928]
    paths: ['.github/workflows/snippets-review-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f50d53c797fb65e981c830f6a895609734eabc3e
          persist-credentials: false
      - name: Archive source and record identity
        run: |
          mkdir -p /tmp/snippets-review
          git archive HEAD | gzip > /tmp/snippets-review/source.tar.gz
          git rev-parse HEAD > /tmp/snippets-review/commit.txt
          git ls-files -s > /tmp/snippets-review/manifest.txt
          sha256sum /tmp/snippets-review/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: snippets-integrity-source
          path: /tmp/snippets-review
          retention-days: 1
          if-no-files-found: error
