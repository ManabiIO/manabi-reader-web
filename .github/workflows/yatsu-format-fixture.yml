name: Yatsu format fixture
on:
  pull_request:
    paths: ['.github/workflows/yatsu-format-fixture.yml']
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium
      - name: Inspect an empty, unauthenticated public app session
        run: |
          mkdir -p /tmp/yatsu-format
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json, hashlib
          out=Path('/tmp/yatsu-format')
          with sync_playwright() as p:
              browser=p.chromium.launch()
              page=browser.new_page(viewport={'width':1440,'height':1000})
              responses=[]
              def capture(response):
                  if response.url.startswith('https://app.yatsu.moe/') and '.js' in response.url:
                      responses.append(response)
              page.on('response',capture)
              page.goto('https://app.yatsu.moe',wait_until='networkidle')
              page.wait_for_timeout(2000)
              (out/'initial.html').write_text(page.content())
              (out/'initial.txt').write_text(page.locator('body').inner_text())
              page.screenshot(path=str(out/'initial.png'),full_page=True)
              for i,response in enumerate(responses):
                  try:
                      body=response.text()
                      (out/f'bundle-{i}.js').write_text(body)
                  except Exception: pass
              (out/'responses.json').write_text(json.dumps([r.url for r in responses]))
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yatsu-format-observation
          path: /tmp/yatsu-format
          retention-days: 1
