name: Library WebKit dependency diagnostics
on:
  push:
    branches: [feat/local-library-migration-webdav-search-20260924]
    paths: ['.github/workflows/library-webkit-dependencies.yml']
permissions:
  contents: read
jobs:
  dependencies:
    if: >-
      github.repository == 'ManabiIO/manabi-reader-web' && github.event.head_commit.message == 'test: prepare WebKit dependency diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtain Ubuntu WebKit runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libicu74 libjpeg-turbo8 libmanette-0.2-0 libgles2
          mkdir -p /tmp/webkit-dependencies/lib
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('/usr/lib/x86_64-linux-gnu')
          for pattern in ['libicu*.so.74*', 'libjpeg.so.8*', 'libmanette-0.2.so.*', 'libGLESv2.so.2*']:
              paths = list(root.glob(pattern))
              assert paths, pattern
              for path in paths:
                  shutil.copyfile(path, Path('/tmp/webkit-dependencies/lib') / path.name)
          PY
          tar -czf /tmp/webkit-dependencies/runtime-libraries.tar.gz -C /tmp/webkit-dependencies lib
          rm -rf /tmp/webkit-dependencies/lib
      - uses: actions/upload-artifact@v4
        with:
          name: library-webkit-runtime-dependencies
          path: /tmp/webkit-dependencies/runtime-libraries.tar.gz
          retention-days: 1
