name: Publish local-library closeout repair
on:
  push:
    branches: [feat/local-library-migration-webdav-search-20260924]
    paths: ['.github/local-library-closeout.patch.xz', '.github/workflows/library-webkit-dependencies.yml']
permissions:
  contents: read
jobs:
  apply:
    if: >-
      github.repository == 'ManabiIO/manabi-reader-web' && github.event.head_commit.message == 'chore: publish local-library closeout repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply the reviewed source-only patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, lzma
          patch = lzma.decompress(Path('.github/local-library-closeout.patch.xz').read_bytes())
          assert len(patch) == 23968
          assert hashlib.sha256(patch).hexdigest() == '42758b16bcc7dc2164cf733ebf8960254d3e1c4a06c7dd08af61f72d411376dc'
          Path('/tmp/closeout.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/closeout.patch
          git apply --index /tmp/closeout.patch
          git rm .github/local-library-closeout.patch.xz
          git diff --cached --check
      - name: Commit without overwriting concurrent changes
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          branch=feat/local-library-migration-webdav-search-20260924
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: fence WebDAV import lifetime and settle failed book transactions'
          git push origin "HEAD:refs/heads/$branch"
