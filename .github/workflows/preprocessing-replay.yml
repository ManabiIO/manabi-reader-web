name: Preprocessing integration replay
on:
  push:
    branches: [codex/manabi-web-preprocessing-r3]
    paths:
      - '.github/workflows/preprocessing-replay.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm svelte-kit sync
        working-directory: apps/web
      - name: Verify the published baseline
        run: |
          set -o pipefail
          node --test test/preprocessing/*.test.mjs | tee preprocessing-replay.log
          pnpm eslint .
      - name: Archive public replay inputs only
        run: |
          mkdir -p replay
          git rev-parse HEAD > replay/REVISION
          git archive --format=tar HEAD | gzip > replay/source.tar.gz
          tar -czf replay/dependencies.tar.gz node_modules apps/web/node_modules apps/web/.svelte-kit
          cp preprocessing-replay.log replay/
          (cd replay && sha256sum source.tar.gz dependencies.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: preprocessing-integration-replay
          path: replay/
          if-no-files-found: error
          retention-days: 3
