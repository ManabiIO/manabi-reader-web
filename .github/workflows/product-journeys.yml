name: Product journeys
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'tests/browser/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/product-journeys.yml'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: product-journeys-${{ github.ref }}
  cancel-in-progress: true
jobs:
  journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and regression fixture
        run: |
          mkdir -p test-results/product-journeys
          git rev-parse HEAD > test-results/product-journeys/commit.txt
          git ls-tree -r HEAD > test-results/product-journeys/tree.txt
          cp tests/browser/test_product_journeys.py tests/browser/test_search_quality.py test-results/product-journeys/
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - run: pnpm --dir apps/web check
      - name: Build the real application
        env:
          BASE_PATH: /reader-web
        run: pnpm build
      - name: Install both browser engines
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium webkit
      - name: Execute all product journeys in both engines
        run: |
          set +e
          status=0
          for engine in chromium webkit; do
            LIBRARY_BROWSER=$engine timeout -v -k 10s 360s python tests/browser/test_product_journeys.py 2>&1 | tee test-results/product-journeys/$engine.log
            result=${PIPESTATUS[0]}
            if [ "$result" -ne 0 ]; then status=1; fi
            LIBRARY_BROWSER=$engine timeout -v -k 10s 360s python tests/browser/test_search_quality.py 2>&1 | tee test-results/product-journeys/$engine-search-quality.log
            result=${PIPESTATUS[0]}
            if [ "$result" -ne 0 ]; then status=1; fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-journey-evidence
          path: test-results/
          retention-days: 7
