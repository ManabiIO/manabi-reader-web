name: Lyrics transcript qualification
# Isolated candidate validation. Objects job writes immutable blobs only, never refs.
on:
  push:
    branches: [codex/video-lyrics-qualification-20260925]
    paths: [.github/workflows/media-lyrics-review.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: media-lyrics-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: lyrics-reviewed-source
          run-id: 36133470830
          github-token: ${{ github.token }}
          path: reviewed
      - name: Apply checksum-verified candidate and reload boundary assertions
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=pathlib.Path('reviewed/lyrics-candidate.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='f74deb0dfba3922fd50386ebea8b415a07ff0bb4e4d32b27e7ab125233e515ec'
          entries=json.loads(raw)
          assert len(entries)==18 and len({e['path'] for e in entries})==18
          for entry in entries:
              path=pathlib.Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert all(not p.is_symlink() for p in [path,*path.parents])
              data=entry['content'].encode()
              assert hashlib.sha256(data).hexdigest()==entry['sha256']
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          path=pathlib.Path('tests/media/app-browser.py'); text=path.read_text()
          old="        results.append('close/reopen retains selected tracks')"
          assert text.count(old)==1
          text=text.replace(old,'''        expect(page.locator('.transcript-pane')).to_be_visible()
                  # A rendered row is not a durable write acknowledgement. Establish the
                  # actual committed IDB state before testing reload, without sleep timers.
                  page.wait_for_function("""async (primary) => {
                      const db = await new Promise((yes,no) => {
                          const r=indexedDB.open('manabi-media-v1');
                          r.onsuccess=()=>yes(r.result);r.onerror=()=>no(r.error);
                      });
                      try {
                          const tx=db.transaction(['local','records'],'readonly');
                          const read=name=>new Promise((yes,no)=>{
                              const r=tx.objectStore(name).getAll();
                              r.onsuccess=()=>yes(r.result);r.onerror=()=>no(r.error);
                          });
                          const [local,records]=await Promise.all([read('local'),read('records')]);
                          return local.some(v=>v?.open===true) && records.some(v=>v?.payload?.primary===primary);
                      } finally {db.close();}
                  }""",arg=chosen)
                  results.append('close/reopen retains selected tracks and commits native storage')'''.replace('\n                  ','\n        '))
          text=text.replace("        assert download.value.suggested_filename=='video.ja.srt'", "        assert download.value.suggested_filename=='video.ja.srt'\n        assert 'こんにちは。' in pathlib.Path(download.value.path()).read_text()")
          text=text.replace("        assert float(page.evaluate('localStorage.getItem(\"lineHeight\")')) == 1.9", "        assert float(page.evaluate('localStorage.getItem(\"lineHeight\")')) == 1.9\n        page.wait_for_function('() => { const s=getComputedStyle(document.querySelector(\".transcript-text\")); return Math.abs(parseFloat(s.lineHeight)/parseFloat(s.fontSize)-1.9)<.03; }')")
          old='            page.screenshot(path=str(args.output/"failure.png"))'
          assert text.count(old)==1
          text=text.replace(old,'''            page.screenshot(path=str(args.output/"failure.png"))
                      state=page.evaluate("""async()=>{
                          const r=indexedDB.open('manabi-media-v1');
                          const db=await new Promise((yes,no)=>{r.onsuccess=()=>yes(r.result);r.onerror=()=>no(r.error)});
                          const tx=db.transaction(['local','records'],'readonly');
                          const read=n=>new Promise(yes=>{const q=tx.objectStore(n).getAll();q.onsuccess=()=>yes(q.result)});
                          const data=await Promise.all([read('local'),read('records')]);db.close();
                          return {data,primary:document.querySelector('[aria-label="Transcript track"]')?.value,secondary:document.querySelector('[aria-label="Translation track"]')?.value};
                      }""")
                      (args.output/'storage-diagnostics.json').write_text(json.dumps(state,ensure_ascii=False))'''.replace('\n                      ','\n            '))
          path.write_text(text)
          pathlib.Path('lyrics-paths.json').write_text(json.dumps([e['path'] for e in entries]))
          PY
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - name: Format reviewed source and enforce lint
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          paths=json.loads(pathlib.Path('lyrics-paths.json').read_text())
          formatted=[p for p in paths if pathlib.Path(p).suffix in ('.ts','.svelte','.mjs','.css','.md')]
          subprocess.run(['pnpm','exec','prettier','--write',*formatted],check=True)
          linted=[p for p in paths if pathlib.Path(p).suffix in ('.ts','.mjs')]
          subprocess.run(['pnpm','exec','eslint','--fix',*linted],check=True)
          subprocess.run(['python3','-m','py_compile','tests/media/app-browser.py'],check=True)
          PY
      - name: Capture candidate source
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          source=[]
          for name in json.loads(pathlib.Path('lyrics-paths.json').read_text()):
              data=pathlib.Path(name).read_bytes()
              source.append({'path':name,'content':data.decode(),'sha256':hashlib.sha256(data).hexdigest(),'sha':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()})
          pathlib.Path('lyrics-candidate.json').write_text(json.dumps(source,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyrics-reviewed-source
          path: lyrics-candidate.json
          if-no-files-found: error
          retention-days: 7
      - run: pnpm --dir apps/web check
      - run: pnpm exec eslint .
      - name: Build actual application
        env:
          BASE_PATH: /Reader-Web
        run: pnpm --dir apps/web build
      - name: Provision fixture and browser tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Generate fixture and run core regressions
        id: fixture
        run: |
          set -o pipefail
          mkdir -p lyrics-evidence
          python tools/media/generate-fixtures.py --language en > fixture-path.txt
          export MEDIA_FIXTURE="$(cat fixture-path.txt)"
          pnpm exec node tools/media/test.mjs | tee lyrics-evidence/core.log
      - name: Real application, IndexedDB and shared display settings
        run: python tests/media/app-browser.py --fixture "$(cat fixture-path.txt)" --output lyrics-evidence/app
      - name: Player, workspace and Web Audio regressions
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        run: |
          export CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/media/dom-browser.py --fixture "$(cat fixture-path.txt)" --output lyrics-evidence/player
          python tests/media/workspace-dom.py --fixture "$(cat fixture-path.txt)" --output lyrics-evidence/workspace
          python tests/media/audio-browser.py --output lyrics-evidence/audio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyrics-qualification-evidence
          path: lyrics-evidence/
          if-no-files-found: warn
          retention-days: 7
  objects:
    needs: review
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lyrics-reviewed-source
      - name: Stage verified Git blob objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          entries=json.loads(pathlib.Path('lyrics-candidate.json').read_text());staged=[]
          for entry in entries:
              data=entry['content'].encode()
              assert hashlib.sha256(data).hexdigest()==entry['sha256']
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==entry['sha']
              request=urllib.request.Request('https://api.github.com/repos/ManabiIO/manabi-reader-web/git/blobs',method='POST',data=json.dumps({'content':entry['content'],'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response: result=json.load(response)
              assert result['sha']==entry['sha']
              staged.append({k:entry[k] for k in ('path','sha','sha256')})
          pathlib.Path('lyrics-staged.json').write_text(json.dumps(staged,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lyrics-staged-objects
          path: lyrics-staged.json
          if-no-files-found: error
          retention-days: 7
