name: Lyrics transcript qualification
# Temporary isolated review branch. No ref, commit, PR, release or deployment writes.
on:
  push:
    branches: [codex/video-lyrics-qualification-20260925]
    paths: [.github/workflows/media-lyrics-review.yml]
permissions:
  contents: read
concurrency:
  group: media-lyrics-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply checksum-verified local source edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          parts = ['d9908d211a0006a5fb9040d0f68e8dc56fed35c4', '17a62605d55eb2004b68011d134435da43b017d2', '512ab2a6f6ddcfb5f9148cea45be7efdc1b88c04', 'c3d68ad86c99f3b70df4fb6093cceee703c6a6bf']
          expected = ['634ddee092430ee72a479b167bffc7390770364f', *parts[1:]]
          raw = []
          for index, sha in enumerate(parts):
              request = urllib.request.Request('https://api.github.com/repos/ManabiIO/manabi-reader-web/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  value = json.load(response)
              assert value['sha'] == sha and value['encoding'] == 'base64'
              chunk = base64.b64decode(value['content'])
              if index == 0:
                  # Correct one transcription error in the transport envelope;
                  # exact original chunk and whole payload hashes are mandatory.
                  text = base64.b64encode(chunk).decode()
                  assert text[1748] == 'H' and len(text) == 8000
                  chunk = base64.b64decode(text[:1748] + text[1749:] + 'e', validate=True)
              assert hashlib.sha1(b'blob ' + str(len(chunk)).encode() + b'\0' + chunk).hexdigest() == expected[index]
              raw.append(chunk)
          payload = lzma.decompress(b''.join(raw), memlimit=128*1024*1024)
          assert hashlib.sha256(payload).hexdigest() == '4b407fe2a4c0a677629e52eda4fa995ec881f27e433b7d2e55ec112ce3380d2e'
          edits = json.loads(payload)
          assert len(edits) == 17 and len({e['path'] for e in edits}) == 17
          for entry in edits:
              path = pathlib.Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert all(not part.is_symlink() for part in [path, *path.parents])
              if entry['before'] is None:
                  assert not path.exists(), path
                  content = ''
              else:
                  content = path.read_text()
                  assert hashlib.sha256(content.encode()).hexdigest() == entry['before'], path
              lines = content.splitlines(keepends=True)
              for first, last, replacement in reversed(entry['edits']):
                  assert 0 <= first <= last <= len(lines)
                  lines[first:last] = replacement
              result = ''.join(lines).encode()
              assert hashlib.sha256(result).hexdigest() == entry['after'], path
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(result)
          pathlib.Path('lyrics-paths.json').write_text(json.dumps([e['path'] for e in edits]))
          print('Verified and applied all 17 source paths')
          PY
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - name: Format and lint only reviewed source
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          paths = json.loads(pathlib.Path('lyrics-paths.json').read_text())
          formatted = [p for p in paths if pathlib.Path(p).suffix in ('.ts', '.svelte', '.mjs', '.css', '.md')]
          subprocess.run(['pnpm','exec','prettier','--write',*formatted],check=True)
          linted = [p for p in paths if pathlib.Path(p).suffix in ('.ts','.svelte','.mjs')]
          subprocess.run(['pnpm','exec','eslint','--fix',*linted],check=True)
          PY
      - name: Capture candidate source
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          source=[]
          for name in json.loads(pathlib.Path('lyrics-paths.json').read_text()):
              data=pathlib.Path(name).read_bytes()
              source.append({'path':name,'content':data.decode(),'sha256':hashlib.sha256(data).hexdigest(),'sha':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()})
          pathlib.Path('lyrics-candidate.json').write_text(json.dumps(source,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyrics-reviewed-source
          path: lyrics-candidate.json
          if-no-files-found: error
          retention-days: 7
      - name: Installed application typecheck
        run: pnpm --dir apps/web check
      - name: Normal repository lint
        run: pnpm exec eslint .
      - name: Build actual application
        env:
          BASE_PATH: /Reader-Web
        run: pnpm --dir apps/web build
      - name: Provision generated-fixture and browser tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Generate cached English fixture and run core regressions
        run: |
          mkdir -p lyrics-evidence
          python tools/media/generate-fixtures.py --language en > fixture-path.txt
          export MEDIA_FIXTURE="$(cat fixture-path.txt)"
          pnpm exec node tools/media/test.mjs | tee lyrics-evidence/core.log
      - name: Real application, IndexedDB and shared display settings
        run: python tests/media/app-browser.py --fixture "$(cat fixture-path.txt)" --output lyrics-evidence/app
      - name: Player, workspace and Web Audio regressions
        run: |
          export CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/media/dom-browser.py --fixture "$(cat fixture-path.txt)" --output lyrics-evidence/player
          python tests/media/workspace-dom.py --fixture "$(cat fixture-path.txt)" --output lyrics-evidence/workspace
          python tests/media/audio-browser.py --output lyrics-evidence/audio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyrics-qualification-evidence
          path: lyrics-evidence/
          if-no-files-found: warn
          retention-days: 7
  objects:
    needs: review
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lyrics-reviewed-source
      - name: Stage verified Git blob objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          entries=json.loads(pathlib.Path('lyrics-candidate.json').read_text())
          staged=[]
          for entry in entries:
              data=entry['content'].encode()
              assert hashlib.sha256(data).hexdigest()==entry['sha256']
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==entry['sha']
              request=urllib.request.Request('https://api.github.com/repos/ManabiIO/manabi-reader-web/git/blobs',method='POST',data=json.dumps({'content':entry['content'],'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  result=json.load(response)
              assert result['sha']==entry['sha']
              staged.append({k:entry[k] for k in ('path','sha','sha256')})
          pathlib.Path('lyrics-staged.json').write_text(json.dumps(staged,indent=2))
          print('Staged',len(staged),'immutable source objects; no refs or commits changed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lyrics-staged-objects
          path: lyrics-staged.json
          if-no-files-found: error
          retention-days: 7
