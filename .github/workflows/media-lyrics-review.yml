name: Lyrics transcript qualification
# Isolated candidate validation. The object job creates immutable blobs only.
# No ref, commit, PR, release or deployment writes.
on:
  push:
    branches: [codex/video-lyrics-qualification-20260925]
    paths: [.github/workflows/media-lyrics-review.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: media-lyrics-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: lyrics-reviewed-source
          run-id: 36131653443
          github-token: ${{ github.token }}
          path: reviewed
      - name: Apply verified candidate and regression corrections
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=pathlib.Path('reviewed/lyrics-candidate.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='e0e61207c4d0cf9639a6377bb65f1b524cf7200c6f1bbd7c8a1bce104cd41fb1'
          entries=json.loads(raw)
          assert len(entries)==17 and len({e['path'] for e in entries})==17
          for entry in entries:
              path=pathlib.Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert all(not p.is_symlink() for p in [path,*path.parents])
              data=entry['content'].encode()
              assert hashlib.sha256(data).hexdigest()==entry['sha256']
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          path=pathlib.Path('apps/web/src/lib/media/workspace.ts')
          text=path.read_text();old='if (active()) return await this.generate();'
          assert text.count(old)==1
          path.write_text(text.replace(old,old+'\n        return undefined;'))
          path=pathlib.Path('tests/media/app-browser.py')
          text=path.read_text();old="str(args.fixture / 'video.mp4'),"
          assert text.count(old)==1
          text=text.replace(old,"{'name':'video.mp4','mimeType':'video/mp4','buffer':(args.fixture / 'video.mp4').read_bytes()},")
          # Retain a screenshot and DOM snapshot when the real application fails.
          text=text.replace('    finally:\n        server.shutdown()', '    except Exception:\n        try:\n            page.screenshot(path=str(args.output/"failure.png"))\n            (args.output/"failure.html").write_text(page.content())\n        except Exception:\n            pass\n        raise\n    finally:\n        server.shutdown()')
          path.write_text(text)
          path=pathlib.Path('tests/media/jobs.test.mjs');text=path.read_text()
          first=text.index("test('resume refuses a live lease; recovery only releases stale owners without Web Locks'")
          last=text.index("test('non-finite PCM",first)
          section=text[first:last]
          assert section.count('harness(async')==1 and section.endswith('  }));\n')
          section=section.replace('harness(async','withLocks(undefined, () => harness(async',1)
          section=section[:-len('  }));\n')]+'  })));\n'
          text=text[:first]+section+text[last:]
          text += '''
          // Node may expose navigator.locks; each capability scenario owns its mock.
          async function withLocks(locks, body) {
            const previous = Object.getOwnPropertyDescriptor(navigator, 'locks');
            Object.defineProperty(navigator, 'locks', { configurable: true, value: locks });
            try { return await body(); }
            finally {
              if (previous) Object.defineProperty(navigator, 'locks', previous);
              else delete navigator.locks;
            }
          }
          for (const available of [false, true]) {
            test(`recovery ${available ? 'releases an orphan under exclusive lock' : 'leaves a held inference lock untouched'}`, () =>
              withLocks({ async request(name, options, callback) {
                assert.equal(name, 'manabi-moss-inference');
                assert.deepEqual(options, { ifAvailable: true });
                return callback(available ? { name } : null);
              } }, () => harness(async ({ queue, store }) => {
                const q = queue({ dispose() {} });
                await store.putLocal(scope, 'jobs', id, {
                  ...job(), status: 'running', ownerId: owner, leaseUntil: Date.now() + 90000
                });
                await q.recover();
                assert.equal((await store.local(scope, 'jobs', id)).status, available ? 'paused' : 'running');
              })));
          }
          '''
          path.write_text(text)
          paths=[e['path'] for e in entries]+['tests/media/jobs.test.mjs']
          pathlib.Path('lyrics-paths.json').write_text(json.dumps(paths))
          PY
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - name: Format reviewed source and enforce lint
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          paths=json.loads(pathlib.Path('lyrics-paths.json').read_text())
          formatted=[p for p in paths if pathlib.Path(p).suffix in ('.ts','.svelte','.mjs','.css','.md')]
          subprocess.run(['pnpm','exec','prettier','--write',*formatted],check=True)
          linted=[p for p in paths if pathlib.Path(p).suffix in ('.ts','.mjs')]
          subprocess.run(['pnpm','exec','eslint','--fix',*linted],check=True)
          PY
      - name: Capture candidate source
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          source=[]
          for name in json.loads(pathlib.Path('lyrics-paths.json').read_text()):
              data=pathlib.Path(name).read_bytes()
              source.append({'path':name,'content':data.decode(),'sha256':hashlib.sha256(data).hexdigest(),'sha':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()})
          pathlib.Path('lyrics-candidate.json').write_text(json.dumps(source,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyrics-reviewed-source
          path: lyrics-candidate.json
          if-no-files-found: error
          retention-days: 7
      - name: Installed application typecheck
        run: pnpm --dir apps/web check
      - name: Normal repository lint
        run: pnpm exec eslint .
      - name: Build actual application
        env:
          BASE_PATH: /Reader-Web
        run: pnpm --dir apps/web build
      - name: Provision fixture and browser tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Generate fixture and run core regressions
        run: |
          set -o pipefail
          mkdir -p lyrics-evidence
          python tools/media/generate-fixtures.py --language en > fixture-path.txt
          export MEDIA_FIXTURE="$(cat fixture-path.txt)"
          pnpm exec node tools/media/test.mjs | tee lyrics-evidence/core.log
      - name: Real application, IndexedDB and shared display settings
        run: python tests/media/app-browser.py --fixture "$(cat fixture-path.txt)" --output lyrics-evidence/app
      - name: Player, workspace and Web Audio regressions
        if: ${{ !cancelled() }}
        run: |
          export CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/media/dom-browser.py --fixture "$(cat fixture-path.txt)" --output lyrics-evidence/player
          python tests/media/workspace-dom.py --fixture "$(cat fixture-path.txt)" --output lyrics-evidence/workspace
          python tests/media/audio-browser.py --output lyrics-evidence/audio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyrics-qualification-evidence
          path: lyrics-evidence/
          if-no-files-found: warn
          retention-days: 7
  objects:
    needs: review
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lyrics-reviewed-source
      - name: Stage verified Git blob objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          entries=json.loads(pathlib.Path('lyrics-candidate.json').read_text())
          staged=[]
          for entry in entries:
              data=entry['content'].encode()
              assert hashlib.sha256(data).hexdigest()==entry['sha256']
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==entry['sha']
              request=urllib.request.Request('https://api.github.com/repos/ManabiIO/manabi-reader-web/git/blobs',method='POST',data=json.dumps({'content':entry['content'],'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  result=json.load(response)
              assert result['sha']==entry['sha']
              staged.append({k:entry[k] for k in ('path','sha','sha256')})
          pathlib.Path('lyrics-staged.json').write_text(json.dumps(staged,indent=2))
          print('Staged',len(staged),'immutable source objects; no refs or commits changed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lyrics-staged-objects
          path: lyrics-staged.json
          if-no-files-found: error
          retention-days: 7
