name: Foliate layered slide
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'tests/browser/test_foliate_slide.py'
      - 'tests/unit/foliate-*.test.mjs'
      - '.github/workflows/foliate-slide.yml'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foliate-slide-${{ github.ref }}
  cancel-in-progress: true
jobs:
  slide:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - run: pnpm --dir apps/web check
      - run: node --test tests/unit/foliate-*.test.mjs
      - name: Build the real reader
        env:
          BASE_PATH: /reader-web
        run: pnpm build
      - name: Exercise gestures and capture keyframes
        env:
          SLIDE_BROWSER: ${{ matrix.browser }}
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
          set -o pipefail
          python tests/browser/test_foliate_slide.py 2>&1 | tee foliate-slide.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foliate-slide-${{ matrix.browser }}
          path: |
            foliate-slide.log
            test-results/
          retention-days: 7
