name: Unified search contract
on:
  pull_request:
    paths:
      - 'apps/web/src/lib/search/**'
      - 'apps/web/src/lib/library/library-workspace.svelte'
      - 'apps/web/src/lib/library/search-normalization.ts'
      - 'apps/web/src/lib/media/search-text.ts'
      - 'apps/web/src/lib/snippets/search.ts'
      - 'tests/unit/unified-search.test.mjs'
      - 'tests/unit/library-search-scope.test.mjs'
      - 'tests/unit/search-normalization.test.mjs'
      - 'tests/unit/search-source-session.test.mjs'
      - 'tests/unit/search-result-rows.test.mjs'
      - 'tests/unit/search-worker-lifetime.test.mjs'
      - 'tests/unit/book-title-match-text.test.mjs'
      - '.github/workflows/unified-search.yml'
permissions:
  contents: read
jobs:
  lifetime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: >-
          node --experimental-strip-types --test
          tests/unit/unified-search.test.mjs
          tests/unit/library-search-scope.test.mjs
          tests/unit/search-normalization.test.mjs
          tests/unit/search-source-session.test.mjs
          tests/unit/search-result-rows.test.mjs
          tests/unit/search-worker-lifetime.test.mjs
          tests/unit/book-title-match-text.test.mjs
