name: Parity development workspace
on:
  push:
    branches: [feat/library-selection-metadata-reader-chrome-20260925]
    paths: [.github/workflows/parity-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture reproducible source and installed tools
        run: |
          mkdir -p /tmp/parity-workspace
          git archive --format=tar HEAD | gzip > /tmp/parity-workspace/source.tar.gz
          tar -czf /tmp/parity-workspace/dependencies.tar.gz node_modules apps/web/node_modules packages/*/node_modules
          cp "$(command -v node)" /tmp/parity-workspace/node
          git rev-parse HEAD > /tmp/parity-workspace/commit.txt
          sha256sum /tmp/parity-workspace/* > /tmp/parity-workspace/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: parity-development-workspace
          path: /tmp/parity-workspace
          retention-days: 1
          if-no-files-found: error
