name: Parity native reference
on:
  push:
    branches: [feat/library-selection-metadata-reader-chrome-20260925]
    paths: [.github/workflows/parity-workspace.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/LakeOfFire
          ref: 10fdf15c8ce4550b4e7900830843c1c8f2ac9f98
          persist-credentials: false
          sparse-checkout: Sources/LakeOfFireReader/Resources/Resources/foliate-js
      - uses: actions/upload-artifact@v4
        with:
          name: native-navigation-reference
          path: |
            Sources/LakeOfFireReader/Resources/Resources/foliate-js/ebook-viewer.js
            Sources/LakeOfFireReader/Resources/Resources/foliate-js/ebook-viewer-nav.js
            Sources/LakeOfFireReader/Resources/Resources/foliate-js/ebook-viewer.html
          retention-days: 1
          if-no-files-found: error
