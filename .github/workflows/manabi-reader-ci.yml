name: Manabi Reader static build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: reader-static-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - run: node --experimental-strip-types --test tests/unit/*.test.mjs
      - name: Reader archive, typography and service-worker regressions
        run: pnpm test:reader
      - name: Whispersync core and Svelte compilation
        run: node test/whispersync/run.mjs --coverage --svelte --browser-bundle=test-results/whispersync-bundle.js
      - name: Type-check committed application source
        run: pnpm --dir apps/web check
      - name: Compile production static artifact
        env:
          BASE_PATH: /Reader-Web
        run: pnpm build
      - name: Browser acceptance for the actual static app and filesystem adapter
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
          set -o pipefail
          python tests/browser/test_offline_reader.py 2>&1 | tee browser-results.log
          python tests/browser/test_static_reader.py 2>&1 | tee -a browser-results.log
          python tests/browser/test_local_library.py 2>&1 | tee -a browser-results.log
          python test/whispersync/browser.py test-results/whispersync-bundle.js 2>&1 | tee -a browser-results.log
          python tests/browser/test_whispersync.py 2>&1 | tee -a browser-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-browser-results
          path: |
            browser-results.log
            test-results/
          retention-days: 3

  whispersync-engines:
    name: Whispersync ${{ matrix.browser }} qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - name: Build standalone browser harness
        run: node test/whispersync/run.mjs --browser-bundle=test-results/whispersync-bundle.js
      - name: Install Python Playwright and browser
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Offline worker lifecycle in ${{ matrix.browser }}
        run: python tests/browser/test_offline_worker.py --browser ${{ matrix.browser }}
      - name: Run ${{ matrix.browser }} browser qualification
        run: python test/whispersync/browser.py test-results/whispersync-bundle.js --browser ${{ matrix.browser }} --autoplay-policy normal
      - name: Build the actual app for WebKit acceptance
        if: matrix.browser == 'webkit'
        env:
          BASE_PATH: /Reader-Web
        run: |
          pnpm --dir apps/web exec svelte-kit sync
          pnpm build
      - name: Run actual-app WebKit acceptance
        if: matrix.browser == 'webkit'
        run: python tests/browser/test_whispersync.py --browser webkit
      - name: Automatic offline reopening in the actual WebKit app
        if: matrix.browser == 'webkit'
        run: python tests/browser/test_offline_reader.py --browser webkit
      - name: Retain engine diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-${{ matrix.browser }}-results
          path: test-results/
          retention-days: 3
