name: Apply verified local-library implementation
on:
  push:
    branches: [feat/local-library-migration-webdav-search-20260924]
    paths: ['.github/local-library-finish/**', '.github/workflows/apply-local-library-implementation.yml']
permissions:
  contents: read
concurrency:
  group: apply-local-library-implementation
  cancel-in-progress: false
jobs:
  apply:
    if: >-
      github.repository == 'ManabiIO/manabi-reader-web' && github.event.head_commit.message == 'chore: publish verified local-library implementation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify and apply source only
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          root = Path('.github/local-library-finish')
          encoded = ''.join((root / f'{i:02d}.b64').read_text() for i in range(8))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 240919
          assert hashlib.sha256(patch).hexdigest() == 'e6d238e4a16f0a9a80a9c526c1ff6be4cebc5ab8171c885d42741e1a352cf3c9'
          Path('/tmp/local-library-verified.patch').write_bytes(patch)
          PY
          # GITHUB_TOKEN has no workflow-write permission. Workflow updates and
          # deletion of this temporary workflow are separate connector writes.
          git apply --check --index --exclude='.github/workflows/*' /tmp/local-library-verified.patch
          git apply --index --exclude='.github/workflows/*' /tmp/local-library-verified.patch
          git rm -r .github/local-library-finish
          git diff --cached --check
      - name: Publish source without overwriting concurrent work
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          branch=feat/local-library-migration-webdav-search-20260924
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement Yatsu migration direct WebDAV and two-section library search'
          git push origin "HEAD:refs/heads/$branch"
