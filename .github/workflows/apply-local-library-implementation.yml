name: Apply Library request lifetime repair
on:
  push:
    branches: [feat/local-library-migration-webdav-search-20260924]
    paths: ['.github/local-library-finish/**', '.github/workflows/apply-local-library-implementation.yml']
permissions:
  contents: read
jobs:
  apply:
    if: >-
      github.repository == 'ManabiIO/manabi-reader-web' && github.event.head_commit.message == 'chore: apply Library request lifetime repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify and apply source-only repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          patch = lzma.decompress(base64.b64decode(Path('.github/local-library-finish/open-request.b64').read_text(), validate=True))
          assert len(patch) == 11415
          assert hashlib.sha256(patch).hexdigest() == '921bd3c45c2d89c626beb36e3339482f5a181e2014dbbfd169799cf7afeadffa'
          Path('/tmp/library-open.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/library-open.patch
          git apply --index /tmp/library-open.patch
          git rm -r .github/local-library-finish
          git diff --cached --check
      - name: Publish source without overwriting concurrent work
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          branch=feat/local-library-migration-webdav-search-20260924
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: retain page-owned book opens through Library refresh and cancel stale navigation'
          git push origin "HEAD:refs/heads/$branch"
