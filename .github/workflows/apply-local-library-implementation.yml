name: Apply local-library implementation
on:
  push:
    branches: [feat/local-library-migration-webdav-search-20260924]
    paths: ['.github/local-library-apply.trigger']
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply local-library implementation [apply-local-library]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact reviewed patch
        run: |
          cat .github/local-library-patch/*.b64 | base64 --decode > /tmp/local-library.patch
          git apply --check /tmp/local-library.patch
          git apply /tmp/local-library.patch
          git diff --check
          git status --short
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json pnpm-lock.yaml apps/web/src tests/unit/ttu-migration.test.mjs tests/browser/test_ttu_migration.py tests/browser/test_books_library.py
          git commit -m "feat: add local-first migration WebDAV and library content search"
          git push origin HEAD
