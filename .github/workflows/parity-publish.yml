name: Publish verified library parity patch
on:
  push:
    branches: [feat/library-selection-metadata-reader-chrome-20260925]
    paths: [.github/workflows/parity-publish.yml]
permissions:
  contents: write
concurrency:
  group: library-parity-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ManabiIO/manabi-reader-web' && github.ref == 'refs/heads/feat/library-selection-metadata-reader-chrome-20260925'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify complete source tree and publish only this feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = d0eca322b001ab1c30b92c8a31dbfbff938544c3
          test "$(git rev-parse HEAD^2)" = 15f95d1e8986f5a4ec95cea87cb7b5d4d3cc1f87
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib
          encoded = ''.join(pathlib.Path('.parity-transfer', str(i)).read_text() for i in range(4))
          assert len(encoded) == 40472
          raw = base64.b64decode(encoded, validate=True)
          decoder = lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch = decoder.decompress(raw, max_length=200000)
          assert decoder.eof and not decoder.unused_data
          assert hashlib.sha256(patch).hexdigest() == '086034797acc8a2415e0af4616ddc7de08d6576d64e39f3e3219e13abf907a9b'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'parity.patch').write_bytes(patch)
          PY
          git rm -r .parity-transfer .github/workflows/parity-publish.yml
          test "$(git write-tree)" = 9de107e997f59c5fccd194e1d2b54e98a89c82b2
          git apply --index --unidiff-zero "$RUNNER_TEMP/parity.patch"
          git diff --cached --check
          tree=$(git write-tree)
          test "$tree" = 4c22b0749572f4a1a3a412728a58ff8526de410c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n' 'feat: add Finder-style library selection, metadata and reader chrome' | git -c core.hooksPath=/dev/null commit-tree "$tree" -p "$GITHUB_SHA")
          branch=refs/heads/feat/library-selection-metadata-reader-chrome-20260925
          test "$(git ls-remote origin "$branch" | cut -f1)" = "$GITHUB_SHA"
          git push origin "$commit:$branch"
          printf '%s\n' "$commit" > "$RUNNER_TEMP/published-commit.txt"
          printf '%s\n' "$tree" > "$RUNNER_TEMP/published-tree.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: library-parity-publication
          path: |
            ${{ runner.temp }}/published-commit.txt
            ${{ runner.temp }}/published-tree.txt
          retention-days: 1
          if-no-files-found: error
