name: Windows native bootstrap

# A single public, stock Windows runner. Evidence is printed to logs only.
# Legacy workflows exclude this exact candidate at job admission.
on:
  push:
    branches: ['codex/reader-windows-sdk56-20261020']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: windows-bootstrap-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: pwsh
env:
  EXPO_NO_TELEMETRY: '1'
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  native:
    name: Windows x64 Debug, Release and synthetic host
    if: >-
      github.event.repository.visibility == 'public' &&
      toJSON(github.event.repository.private) == 'false' &&
      github.repository == 'ManabiIO/manabi-reader-web' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/codex/reader-windows-sdk56-20261020'
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        id: pnpm
        with:
          version: '12.3.4'
          cache: false
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Verify package manager entry point
        env:
          READER_PNPM_ROOT: ${{ steps.pnpm.outputs.dest }}
        run: |
          # pnpm 12's extensionless npm shim can return without executing on
          # Windows. Use its published Node entry; do not rewrite installed tools.
          $entry = Join-Path $env:READER_PNPM_ROOT 'node_modules\pnpm\bin\pnpm.mjs'
          $version = & node $entry --version
          if ($LASTEXITCODE -ne 0 -or "$version".Trim() -ne '12.3.4') {
            throw "Expected pnpm 12.3.4, received: $version"
          }
          "pnpm $version via $entry"
          "READER_PNPM_ENTRY=$entry" | Add-Content $env:GITHUB_ENV
      - name: Record source and validate Windows toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          "Image: $env:ImageOS / $env:ImageVersion" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -version '[18.6.1,19.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'RNW 0.85 requires Visual Studio 2026 >= 18.6.1 with C++ tools.' }
          & $vswhere -latest -products '*' -version '[18.6.1,19.0)' -format json
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10"
          foreach ($component in @('Include\10.0.26100.0\um\Windows.h', 'Lib\10.0.26100.0\um\x64\kernel32.lib', 'bin\10.0.26100.0\x64\rc.exe')) {
            if (!(Test-Path (Join-Path $sdk $component))) { throw "Missing Windows SDK component: $component" }
          }
          'Windows SDK: 10.0.26100.0'
          "Bootstrap qualification only: no Reader library, persistence, installer or product parity acceptance." | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Install exact dependency graph without remote cache
        id: dependencies
        run: |
          node $env:READER_PNPM_ENTRY install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/windows/verify-install.mjs
          exit $LASTEXITCODE
      - name: Windows types, CLI patch and CI admission contracts
        run: |
          node $env:READER_PNPM_ENTRY --dir apps/windows check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test patches/windows-cli/contract.test.mjs test/windows/ci-policy.test.mjs
          exit $LASTEXITCODE
      - name: Qualify Windows development and release JS
        run: |
          node apps/windows/scripts/metro.cjs qualify "$env:RUNNER_TEMP\windows-js"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$env:RUNNER_TEMP\windows-js\qualification.json"
      - name: Compile Debug native host
        id: debug
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ./test/windows/native-build.ps1 -Configuration Debug
      - name: Compile Release native host and bundled Hermes
        id: release
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ./test/windows/native-build.ps1 -Configuration Release
      - name: Exercise actual Release UI through Windows UI Automation
        id: runtime
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        shell: powershell
        run: ./test/windows/native-host.ps1
      - name: Report exact acceptance boundaries
        if: always()
        env:
          DEBUG_OUTCOME: ${{ steps.debug.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        run: |
          "Debug compile: $env:DEBUG_OUTCOME; Release compile: $env:RELEASE_OUTCOME; synthetic runtime: $env:RUNTIME_OUTCOME" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "A missing, skipped, failed or cancelled step is unqualified. WebView2 persistence, Reader screens, IME, Narrator, installer/update and ARM64 acceptance remain separate gates." | Add-Content $env:GITHUB_STEP_SUMMARY
          git status --short
