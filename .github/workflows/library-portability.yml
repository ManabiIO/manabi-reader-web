name: Library portability
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'tests/**'
      - 'test/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/library-portability.yml'
permissions:
  contents: read
concurrency:
  group: library-portability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - name: Unit and type checks
        run: |
          set -o pipefail
          mkdir -p artifacts/library-portability
          git rev-parse HEAD > artifacts/library-portability/commit.txt
          node --experimental-strip-types --test tests/unit/*.test.mjs test/reader/typography.test.mjs | tee artifacts/library-portability/units.log
          pnpm --dir apps/web check 2>&1 | tee artifacts/library-portability/types.log
      - name: Build the actual subpath application
        env:
          BASE_PATH: /Reader-Web
          NODE_OPTIONS: --max-old-space-size=1536
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee artifacts/library-portability/build.log
      - name: Real browsers and HTTPS WebDAV
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium webkit
          set +e
          status=0
          for engine in chromium webkit; do
            mkdir -p artifacts/library-portability/$engine
            LIBRARY_BROWSER=$engine PORTABILITY_ARTIFACTS=artifacts/library-portability/$engine python tests/browser/test_library_portability.py 2>&1 | tee artifacts/library-portability/$engine/results.log
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then status=1; fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-portability-evidence
          path: artifacts/library-portability
          retention-days: 7
