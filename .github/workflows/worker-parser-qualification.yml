name: Worker parser qualification
on:
  pull_request:
    paths: ['.github/workflows/worker-parser-qualification.yml']
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web add --save-exact parse5@8.0.1
      - run: |
          mkdir -p /tmp/worker-parser
          tar -czf /tmp/worker-parser/parser.tar.gz pnpm-lock.yaml apps/web/package.json apps/web/node_modules/parse5 node_modules/.pnpm/parse5@* node_modules/.pnpm/entities@*
      - uses: actions/upload-artifact@v4
        with:
          name: worker-parser-resolution
          path: /tmp/worker-parser
          retention-days: 1
