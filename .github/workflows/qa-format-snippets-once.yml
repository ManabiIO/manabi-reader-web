name: One-shot Snippets formatter
on:
  push:
    branches: [test/fix-snippets-mobile-menu-format-20260929]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/fix-snippets-mobile-menu-format-20260929
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatter
        run: pnpm exec prettier --write apps/web/src/lib/snippets/workspace.svelte
      - name: Commit exact formatter output
        run: |
          git diff --check
          if git diff --quiet -- apps/web/src/lib/snippets/workspace.svelte; then
            echo "Formatter made no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/snippets/workspace.svelte
          git commit -m "style(snippets): apply repository formatter"
          git push origin HEAD:test/fix-snippets-mobile-menu-format-20260929
