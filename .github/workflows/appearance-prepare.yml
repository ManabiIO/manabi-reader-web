name: Prepare appearance candidate
on:
  push:
    branches: [feat/manabi-appearance-20260919]
    paths: ['.github/appearance-patch.*', '.github/workflows/appearance-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply reviewed source patch
        run: |
          python3 - <<'PY'
          import hashlib, json, lzma, pathlib, subprocess
          patch = lzma.decompress(b''.join(pathlib.Path(f'.github/appearance-patch.{i}').read_bytes() for i in range(4)))
          assert hashlib.sha256(patch).hexdigest() == '34b40f4a5d72f88a66ca04d1d9cdfebf6d40400a0c9446aa6047a33c5eeb47a7'
          pathlib.Path('/tmp/appearance.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '/tmp/appearance.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/appearance.patch'], check=True)
          paths = [line.split('\t',2)[2] for line in subprocess.check_output(['git','apply','--numstat','/tmp/appearance.patch'],text=True).splitlines()]
          pathlib.Path('/tmp/appearance-paths.json').write_text(json.dumps(paths))
          # Use real keyboard interaction for range controls; avoid duplicate inherited discovery.
          p = pathlib.Path('tests/browser/test_appearance.py')
          text = p.read_text().replace('from test_static_reader import ReaderBrowser', 'import test_static_reader as baseline').replace('class AppearanceBrowser(ReaderBrowser):','class AppearanceBrowser(baseline.ReaderBrowser):')
          for name,value in [('library',65),('reader',25)]:
              old = f"        self.page.locator('#fade-{name}').fill('{value}')"
              new = f"        self.page.locator('#fade-{name}').focus()\n        self.page.keyboard.press('Home')\n        for _ in range({value}):\n            self.page.keyboard.press('ArrowRight')"
              assert old in text
              text = text.replace(old,new)
          p.write_text(text)
          p = pathlib.Path('docs/appearance.md')
          p.write_text(p.read_text().replace('No proprietary reader implementation or assets were consulted.', 'No Yatsu Reader code or assets were consulted.'))
          PY
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - name: Format changed source
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          paths = json.loads(pathlib.Path('/tmp/appearance-paths.json').read_text())
          formatted = [p for p in paths if pathlib.Path(p).suffix in {'.ts','.js','.mjs','.svelte','.scss','.html','.md','.yml'} and not p.endswith('palettes.scss')]
          subprocess.run(['pnpm','exec','prettier','--write',*formatted],check=True)
          # Record lint failures separately without losing the candidate source evidence.
          source = [p for p in paths if pathlib.Path(p).suffix in {'.ts','.js','.mjs','.svelte'}]
          with open('/tmp/appearance-lint.log','w') as log:
              result = subprocess.run(['pnpm','exec','eslint','--fix',*source],stdout=log,stderr=subprocess.STDOUT)
          pathlib.Path('/tmp/appearance-lint-status').write_text(str(result.returncode))
          PY
          node --experimental-strip-types tools/appearance/generate-css.mjs
      - name: Capture candidate Git objects (no commit or ref writes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          evidence=pathlib.Path('/tmp/appearance-evidence'); evidence.mkdir()
          paths=json.loads(pathlib.Path('/tmp/appearance-paths.json').read_text())
          source=[]; tree=[]
          for name in paths:
              data=pathlib.Path(name).read_bytes(); content=data.decode()
              expected=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
              request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'encoding':'utf-8','content':content}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response: sha=json.load(response)['sha']
              assert sha==expected
              source.append({'path':name,'content':content})
              tree.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          (evidence/'source.json').write_text(json.dumps(source))
          (evidence/'tree.json').write_text(json.dumps(tree))
          (evidence/'base.txt').write_text(os.environ['GITHUB_SHA'])
          (evidence/'lint.log').write_text(pathlib.Path('/tmp/appearance-lint.log').read_text())
          (evidence/'lint-status').write_text(pathlib.Path('/tmp/appearance-lint-status').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: appearance-candidate
          path: /tmp/appearance-evidence
          retention-days: 7
      - name: Unit tests and type checking
        run: |
          set -o pipefail
          node --experimental-strip-types tools/appearance/generate-css.mjs --check
          node --experimental-strip-types --test tests/unit/*.test.mjs | tee /tmp/appearance-evidence/unit.log
          pnpm --dir apps/web check 2>&1 | tee /tmp/appearance-evidence/check.log
      - name: Build the real subpath app
        env:
          BASE_PATH: /Reader-Web
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/appearance-evidence/build.log
      - name: Real browser acceptance
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
          set -o pipefail
          python tests/browser/test_appearance.py 2>&1 | tee /tmp/appearance-evidence/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appearance-candidate-results
          path: |
            /tmp/appearance-evidence
            test-results/
          if-no-files-found: ignore
          retention-days: 7
