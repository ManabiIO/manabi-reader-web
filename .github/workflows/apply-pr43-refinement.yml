name: Publish reviewed PR43 refinement
on:
  push:
    branches: [feat/local-library-migration-webdav-search-20260924]
    paths: ['.github/pr43-refinement.patch.xz.b64', '.github/workflows/apply-pr43-refinement.yml']
permissions:
  contents: read
jobs:
  apply:
    if: >-
      github.repository == 'ManabiIO/manabi-reader-web' && github.event.head_commit.message == 'chore: publish reviewed PR43 refinement'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply verified source and test changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          payload = Path('.github/pr43-refinement.patch.xz.b64').read_text()
          patch = lzma.decompress(base64.b64decode(payload, validate=True))
          assert len(patch) == 35691
          assert hashlib.sha256(patch).hexdigest() == 'b2eeed45edf31661efa294645ddd8ff78f38ab8575c2f80677f94a3a647cfe03'
          Path('/tmp/pr43-refinement.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/pr43-refinement.patch
          git apply --index /tmp/pr43-refinement.patch
          git rm .github/pr43-refinement.patch.xz.b64
          git diff --cached --check
      - name: Publish without overwriting concurrent work
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          branch=feat/local-library-migration-webdav-search-20260924
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: reject corrupt WebDAV inputs and preserve recoverable library search and notes'
          git push origin "HEAD:refs/heads/$branch"
