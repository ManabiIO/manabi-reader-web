name: Ttu migration qualification
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'tests/**'
      - '.github/workflows/ttu-migration.yml'
permissions:
  contents: read
concurrency:
  group: ttu-migration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - run: pnpm --dir apps/web check
      - name: Preserve exact public review inputs
        run: |
          cp "$(command -v node)" "$RUNNER_TEMP/node"
          tar -czf "$RUNNER_TEMP/migration-toolchain.tar.gz" -C "$RUNNER_TEMP" node -C "$PWD" node_modules apps/web/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: migration-toolchain
          path: ${{ runner.temp }}/migration-toolchain.tar.gz
          retention-days: 1
