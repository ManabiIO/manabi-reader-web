name: Ttu migration qualification
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ttu-migration.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ttu-migration.yml'
permissions:
  contents: read
concurrency:
  group: ttu-migration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - name: Verify committed source
        run: pnpm eslint .
      - run: pnpm --dir apps/web check
      - name: Production format and repeated-import contracts
        run: node --experimental-strip-types --test tests/unit/ttu-migration.test.mjs
      - name: Build production static Reader
        env:
          BASE_PATH: /Reader-Web
        run: pnpm build
      - name: Real export and migration browser acceptance
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
          set -o pipefail
          python tests/browser/test_ttu_migration.py 2>&1 | tee migration-browser.log
      - name: Large files, piecemeal selection and interruption
        run: |
          set -o pipefail
          python tests/browser/test_ttu_migration_edges.py 2>&1 | tee migration-edges.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-results
          path: |
            migration-browser.log
            migration-edges.log
            test-results/
          retention-days: 3
