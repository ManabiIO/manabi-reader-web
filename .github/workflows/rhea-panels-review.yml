name: Rhea panel and navigation review
on:
  push:
    branches: [research/rhea-panel-fixes-20260920]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply exact reviewed fixes
        run: |
          mkdir -p /tmp/panel-review
          python3 - <<'PY'
          import pathlib,lzma,hashlib,subprocess,json
          patch=lzma.decompress(pathlib.Path('.github/rhea-panels.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest()=='b8b2dd15995e1ec5f45ff6aadc42912bcbd0508afc8ca6d574ad6b9faa943c4a'
          pathlib.Path('/tmp/panels.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/panels.patch'],check=True)
          subprocess.run(['git','apply','/tmp/panels.patch'],check=True)
          paths=[line.split('\t',2)[2] for line in subprocess.check_output(['git','apply','--numstat','/tmp/panels.patch'],text=True).splitlines()]
          assert len(paths)==17 and all(p.startswith(('apps/web/','tests/browser/','test/reader/')) for p in paths)
          pathlib.Path('/tmp/panel-review/paths.json').write_text(json.dumps(paths))
          for p in paths:
              if p.endswith('.py'):compile(pathlib.Path(p).read_text(),p,'exec')
          PY
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - name: Capture source tree only, never commit or update refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import pathlib,json,subprocess,urllib.request,os
          out=pathlib.Path('/tmp/panel-review');paths=json.loads((out/'paths.json').read_text())
          subprocess.run(['pnpm','exec','prettier','--write',*[p for p in paths if not p.endswith('.py')]],check=True)
          source=[{'path':p,'content':pathlib.Path(p).read_text()} for p in paths]
          tree=[{'path':f['path'],'mode':'100644','type':'blob','content':f['content']} for f in source]
          (out/'source.json').write_text(json.dumps(source))
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/trees',data=json.dumps({'base_tree':'49815c4c13f5f6fced89c307dd3a32db33383744','tree':tree}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=60) as response:(out/'tree-sha.txt').write_text(json.load(response)['sha'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rhea-panels-source
          path: /tmp/panel-review
          retention-days: 7
      - name: Units, lint and types
        run: |
          set -o pipefail
          pnpm exec eslint . 2>&1 | tee /tmp/panel-review/lint.log
          node tools/appearance/lint.mjs | tee /tmp/panel-review/components.log
          pnpm --dir apps/web check 2>&1 | tee /tmp/panel-review/types.log
          node --experimental-strip-types --test tests/unit/*.test.mjs test/reader/typography.test.mjs | tee /tmp/panel-review/units.log
      - name: Build and real Chromium and WebKit tests
        env:
          BASE_PATH: /Reader-Web
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/panel-review/build.log
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium webkit
          status=0
          for engine in chromium webkit; do
            mkdir -p /tmp/panel-review/$engine
            set +e
            APPEARANCE_BROWSER=$engine python tests/browser/test_rhea_ui.py > /tmp/panel-review/$engine/results.log 2>&1
            result=$?
            set -e
            [ $result -eq 0 ] || status=1
            if [ -d test-results ]; then mv test-results /tmp/panel-review/$engine/screenshots; fi
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhea-panels-results
          path: /tmp/panel-review
          retention-days: 7
  completion:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply same fixes with readable production stacks
        run: |
          python3 - <<'PY'
          import pathlib,lzma,hashlib,subprocess
          patch=lzma.decompress(pathlib.Path('.github/rhea-panels.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest()=='b8b2dd15995e1ec5f45ff6aadc42912bcbd0508afc8ca6d574ad6b9faa943c4a'
          pathlib.Path('/tmp/panels.patch').write_bytes(patch)
          subprocess.run(['git','apply','/tmp/panels.patch'],check=True)
          p=pathlib.Path('apps/web/vite.config.js')
          p.write_text(p.read_text().replace('plugins: [tailwindcss(), sveltekit()]','plugins: [tailwindcss(), sveltekit()], build: {minify:false, sourcemap:true}'))
          PY
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BASE_PATH: /Reader-Web
      - name: Use the actual migration workflow browser version
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
          mkdir -p diagnostics
          set -o pipefail
          python tests/browser/test_completed_reading.py 2>&1 | tee diagnostics/completion.log
      - name: Retain generated text source for stack mapping, never fonts
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,json
          out=pathlib.Path('diagnostics');out.mkdir(exist_ok=True)
          root=pathlib.Path('apps/web/build')
          files=[{'path':p.relative_to(root).as_posix(),'content':p.read_text()} for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.map','.css','.html','.json'}]
          (out/'rendering-source.json').write_text(json.dumps(files))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhea-completion-stacks
          path: |
            diagnostics/
            test-results/
          retention-days: 3
