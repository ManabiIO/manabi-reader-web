name: Snippet UI refinement source
on:
  push:
    branches: [codex/snippet-postmerge-review-20260928]
    paths: ['.github/workflows/snippet-review-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 46d1656ba694c75593089a651cf570102bf6aff1
          persist-credentials: false
      - name: Package exact PR 93 files
        run: |
          mkdir -p /tmp/pr93/apps/web/src/lib/snippets /tmp/pr93/test/snippets
          cp apps/web/src/lib/snippets/capture.svelte /tmp/pr93/apps/web/src/lib/snippets/
          cp apps/web/src/lib/snippets/destination-picker.svelte /tmp/pr93/apps/web/src/lib/snippets/
          cp apps/web/src/lib/snippets/editor.svelte /tmp/pr93/apps/web/src/lib/snippets/
          cp apps/web/src/lib/snippets/reader.svelte /tmp/pr93/apps/web/src/lib/snippets/
          cp apps/web/src/lib/snippets/shelf.svelte /tmp/pr93/apps/web/src/lib/snippets/
          cp apps/web/src/lib/snippets/workspace.svelte /tmp/pr93/apps/web/src/lib/snippets/
          cp test/snippets/browser.mjs /tmp/pr93/test/snippets/
          printf '%s\n' 46d1656ba694c75593089a651cf570102bf6aff1 > /tmp/pr93/.source-commit
          tar -czf /tmp/pr93-files.tar.gz -C /tmp pr93
      - uses: actions/upload-artifact@v4
        with:
          name: snippet-pr93-files
          path: /tmp/pr93-files.tar.gz
          retention-days: 1
