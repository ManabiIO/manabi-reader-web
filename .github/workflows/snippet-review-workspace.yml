name: Snippet post-merge review workspace
on:
  push:
    branches: [codex/snippet-postmerge-review-20260928]
    paths: ['.github/workflows/snippet-review-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - name: Package exact workspace
        run: |
          mkdir -p /tmp/snippet-review
          git archive HEAD | tar -x -C /tmp/snippet-review
          cp -a node_modules /tmp/snippet-review/node_modules
          cp -a apps/web/node_modules /tmp/snippet-review/apps/web/node_modules
          cp -a apps/web/.svelte-kit /tmp/snippet-review/apps/web/.svelte-kit
          git rev-parse HEAD > /tmp/snippet-review/.source-commit
          tar -czf /tmp/snippet-review-workspace.tar.gz -C /tmp snippet-review
      - uses: actions/upload-artifact@v4
        with:
          name: snippet-postmerge-workspace
          path: /tmp/snippet-review-workspace.tar.gz
          retention-days: 1
