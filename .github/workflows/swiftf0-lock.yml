name: SwiftF0 lock refresh
on:
  push:
    branches: [feat/swiftf0-pitch]
    paths:
      - '.github/workflows/swiftf0-lock.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/swiftf0-pitch
          persist-credentials: true
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit generated lock
        run: |
          git rm .github/workflows/swiftf0-lock.yml
          git add apps/web/package.json pnpm-lock.yaml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "build(audio): lock SwiftF0 runtime"
          git push origin HEAD:feat/swiftf0-pitch
