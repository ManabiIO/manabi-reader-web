name: Isolated library preparation
on:
  push:
    branches: [codex/library-prepare-20260920]
permissions:
  contents: write
concurrency:
  group: isolated-library-prepare
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'ManabiIO/manabi-reader-web' && github.ref == 'refs/heads/codex/library-prepare-20260920'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply readable follow-up to exact clean parent
        run: |
          mkdir -p /tmp/library-staging /tmp/library-evidence
          cp .github/library-followup.py .github/library-refinements.py .github/library-files.test.mjs .github/test_books_library.py .github/epub-direction.ts /tmp/library-staging/
          git reset --hard e71e675cf0e2937d545577202d360ea43c868625
          python3 /tmp/library-staging/library-followup.py
          cp /tmp/library-staging/library-files.test.mjs tests/unit/library-files.test.mjs
          cp /tmp/library-staging/test_books_library.py tests/browser/test_books_library.py
          cp /tmp/library-staging/epub-direction.ts apps/web/src/lib/functions/file-loaders/epub/epub-direction.ts
          python3 /tmp/library-staging/library-refinements.py
          git add apps/web tests
          git diff --cached --name-only > /tmp/library-evidence/changed-paths.txt
          python3 -m py_compile tests/browser/test_books_library.py
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - name: Format changed source and capture candidate
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          paths = pathlib.Path('/tmp/library-evidence/changed-paths.txt').read_text().splitlines()
          assert paths and all(p.startswith(('apps/web/','tests/')) for p in paths)
          formatted = [p for p in paths if pathlib.Path(p).suffix in {'.ts','.svelte','.mjs','.json','.md'}]
          subprocess.run(['pnpm','exec','prettier','--write',*formatted],check=True)
          subprocess.run(['git','add',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git diff --cached > /tmp/library-evidence/followup.patch
      - name: Publish clean candidate, never the preparation ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Manabi library preparation'
          git config user.email 'noreply@github.com'
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'fix: qualify library metadata, cover direction and physical folder operations' | git commit-tree "$tree" -p e71e675cf0e2937d545577202d360ea43c868625)
          echo "$tree" > /tmp/library-evidence/tree-sha.txt
          echo "$commit" > /tmp/library-evidence/commit.txt
          git ls-tree -r "$commit" > /tmp/library-evidence/tree.txt
          HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $HEADER" push origin "$commit:refs/heads/codex/library-qualified-${GITHUB_RUN_ID}"
          python3 - <<'PY'
          import json, pathlib, subprocess
          files=[]
          for name in subprocess.check_output(['git','ls-files'],text=True).splitlines():
              p=pathlib.Path(name)
              if p.is_file() and p.suffix in {'.ts','.js','.mjs','.cjs','.svelte','.scss','.css','.html','.json','.yml','.yaml','.py','.md'} and p.stat().st_size < 2000000:
                  files.append({'path':name,'content':p.read_text()})
          pathlib.Path('/tmp/library-evidence/source.json').write_text(json.dumps(files))
          PY
      - name: Candidate units, types, component lint and production build
        run: |
          set +e
          node --experimental-strip-types --test tests/unit/*.test.mjs test/reader/typography.test.mjs > /tmp/library-evidence/units.log 2>&1
          echo "units=$?" >> /tmp/library-evidence/results.txt
          pnpm --dir apps/web check > /tmp/library-evidence/types.log 2>&1
          echo "types=$?" >> /tmp/library-evidence/results.txt
          node tools/appearance/lint.mjs > /tmp/library-evidence/lint.log 2>&1
          echo "lint=$?" >> /tmp/library-evidence/results.txt
          BASE_PATH=/Reader-Web pnpm build > /tmp/library-evidence/build.log 2>&1
          echo "build=$?" >> /tmp/library-evidence/results.txt
          cat /tmp/library-evidence/results.txt
          ! grep -Eq '=[1-9][0-9]*$' /tmp/library-evidence/results.txt
      - name: Library browser acceptance
        if: always()
        run: |
          test -d apps/web/build
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium webkit
          set +e
          status=0
          for engine in chromium webkit; do
            mkdir -p /tmp/library-evidence/$engine
            cases=BooksLibraryBrowser
            if [ "$engine" = chromium ]; then cases="$cases BooksLibraryFilesystem"; fi
            LIBRARY_BROWSER=$engine python tests/browser/test_books_library.py $cases > /tmp/library-evidence/$engine/results.log 2>&1
            result=$?
            echo "$engine=$result" >> /tmp/library-evidence/results.txt
            if [ "$result" -ne 0 ]; then status=1; fi
            if [ -d test-results ]; then mv test-results /tmp/library-evidence/$engine/screenshots; fi
          done
          cat /tmp/library-evidence/results.txt
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-library-evidence
          path: /tmp/library-evidence
          retention-days: 7
          if-no-files-found: error
