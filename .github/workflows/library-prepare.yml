name: Isolated library preparation
on:
  push:
    branches: [codex/library-prepare-20260920]
    paths: ['.github/workflows/library-prepare.yml']
permissions:
  contents: write
concurrency:
  group: isolated-library-prepare
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'ManabiIO/manabi-reader-web' && github.ref == 'refs/heads/codex/library-prepare-20260920'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Merge the two reviewed histories and preserve concurrent changes
        run: |
          mkdir -p /tmp/library-evidence
          git config user.name 'Manabi library preparation'
          git config user.email 'noreply@github.com'
          python3 - <<'PY'
          import pathlib, subprocess
          current='50f4167a2ac24f4a31fc0954954bef1bca9c6ae1'
          candidate='4683258402240fc0f932a940262d2d265897db54'
          base='e71e675cf0e2937d545577202d360ea43c868625'
          root=pathlib.Path('/tmp/library-evidence')
          root.joinpath('concurrent.patch').write_bytes(subprocess.check_output(['git','diff',base,current]))
          subprocess.run(['git','reset','--hard',current],check=True)
          result=subprocess.run(['git','merge','--no-commit','--no-ff',candidate],capture_output=True,text=True)
          root.joinpath('merge.log').write_text(result.stdout+result.stderr)
          assert result.returncode in (0,1),result.stderr
          # Reviewed 20227e6 and 50f4167 diffs: these six paths contain the same
          # keyed-loop/type/backup/path-lint fixes, extended and browser-qualified
          # by the candidate. Retain its strict schema and language serialization.
          resolved=[
            'apps/web/src/lib/data/storage/handler/base-handler.ts',
            'apps/web/src/lib/functions/file-loaders/utils/restored-book.ts',
            'apps/web/src/lib/library/book-cover.svelte',
            'apps/web/src/lib/library/cover-stack.svelte',
            'apps/web/src/lib/library/file-operations.ts',
            'apps/web/src/lib/library/library-workspace.svelte']
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert set(conflicts)<=set(resolved),conflicts
          subprocess.run(['git','restore','--source',candidate,'--staged','--worktree','--',*resolved],check=True)
          # The concurrent account/navigation, background and import-identity
          # repairs must remain byte-for-byte, not merely present in history.
          retained=[
            'apps/web/src/app.scss',
            'apps/web/src/lib/appearance/backgrounds.ts',
            'apps/web/src/lib/manabi/client.ts',
            'apps/web/src/lib/manabi/ttu-migration.ts',
            'apps/web/src/routes/manage/+page.svelte',
            'tests/browser/test_rhea_ui.py',
            'tests/unit/rhea-ui.test.mjs']
          for path in retained:
              assert pathlib.Path(path).read_bytes()==subprocess.check_output(['git','show',f'{current}:{path}']),path
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=U'])
          root.joinpath('retained-concurrent-files.txt').write_text('\n'.join(retained))
          subprocess.run(['git','diff','--cached','--check'],check=True)
          root.joinpath('combined.patch').write_bytes(subprocess.check_output(['git','diff','--cached']))
          PY
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - name: Publish clean combined candidate with both parents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'Merge qualified library behavior with concurrent Rhea and backup fixes' | git commit-tree "$tree" -p 50f4167a2ac24f4a31fc0954954bef1bca9c6ae1 -p 4683258402240fc0f932a940262d2d265897db54)
          echo "$tree" > /tmp/library-evidence/tree-sha.txt
          echo "$commit" > /tmp/library-evidence/commit.txt
          git ls-tree -r "$commit" > /tmp/library-evidence/tree.txt
          HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $HEADER" push origin "$commit:refs/heads/codex/library-combined-${GITHUB_RUN_ID}"
          git reset --hard "$commit"
          python3 - <<'PY'
          import json, pathlib, subprocess
          files=[]
          for name in subprocess.check_output(['git','ls-files'],text=True).splitlines():
              p=pathlib.Path(name)
              if p.is_file() and p.suffix in {'.ts','.js','.mjs','.cjs','.svelte','.scss','.css','.html','.json','.yml','.yaml','.py','.md'} and p.stat().st_size < 2000000:
                  files.append({'path':name,'content':p.read_text()})
          pathlib.Path('/tmp/library-evidence/source.json').write_text(json.dumps(files))
          PY
      - name: Read-only units, types, lint and static build
        run: |
          set +e
          node --experimental-strip-types --test tests/unit/*.test.mjs test/reader/typography.test.mjs > /tmp/library-evidence/units.log 2>&1
          echo "units=$?" >> /tmp/library-evidence/results.txt
          pnpm --dir apps/web check > /tmp/library-evidence/types.log 2>&1
          echo "types=$?" >> /tmp/library-evidence/results.txt
          node tools/appearance/lint.mjs > /tmp/library-evidence/lint.log 2>&1
          echo "lint=$?" >> /tmp/library-evidence/results.txt
          pnpm exec eslint . > /tmp/library-evidence/full-lint.log 2>&1
          echo "full-lint=$?" >> /tmp/library-evidence/results.txt
          BASE_PATH=/Reader-Web pnpm build > /tmp/library-evidence/build.log 2>&1
          echo "build=$?" >> /tmp/library-evidence/results.txt
          git diff --exit-code > /tmp/library-evidence/post-check-diff.txt
          echo "unchanged-source=$?" >> /tmp/library-evidence/results.txt
          cat /tmp/library-evidence/results.txt
          ! grep -Eq '=[1-9][0-9]*$' /tmp/library-evidence/results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-checkpoint
          path: /tmp/library-evidence
          retention-days: 7
          if-no-files-found: error
      - name: Actual combined library browser acceptance
        if: always()
        run: |
          test -d apps/web/build
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium webkit
          set +e
          status=0
          for engine in chromium webkit; do
            mkdir -p /tmp/library-evidence/$engine
            cases=BooksLibraryBrowser
            if [ "$engine" = chromium ]; then cases="$cases BooksLibraryFilesystem"; fi
            LIBRARY_BROWSER=$engine python tests/browser/test_books_library.py $cases > /tmp/library-evidence/$engine/results.log 2>&1
            result=$?
            echo "$engine=$result" >> /tmp/library-evidence/results.txt
            if [ "$result" -ne 0 ]; then status=1; fi
            if [ -d test-results ]; then mv test-results /tmp/library-evidence/$engine/screenshots; fi
          done
          git diff --exit-code > /tmp/library-evidence/post-browser-diff.txt
          echo "unchanged-browser-source=$?" >> /tmp/library-evidence/results.txt
          cat /tmp/library-evidence/results.txt
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-library-evidence
          path: /tmp/library-evidence
          retention-days: 7
          if-no-files-found: error
