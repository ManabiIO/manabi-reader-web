name: Isolated library preparation
on:
  push:
    branches: [codex/library-prepare-20260920]
    paths: ['.github/workflows/library-prepare.yml']
permissions:
  contents: write
concurrency:
  group: isolated-library-prepare
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'ManabiIO/manabi-reader-web' && github.ref == 'refs/heads/codex/library-prepare-20260920'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Correct the test-only committed-value wait
        run: |
          mkdir -p /tmp/library-evidence
          cp .github/library-browser-poll.py /tmp/
          git reset --hard 8694fd3f6e92a3e9c765e0d5992b7cf498010fe2
          python3 /tmp/library-browser-poll.py
          python3 -m py_compile tests/browser/test_books_library.py
          git add tests/browser/test_books_library.py
          git diff --cached --check
          git diff --cached > /tmp/library-evidence/poll.patch
      - name: Publish clean test refinement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Manabi library preparation'
          git config user.email 'noreply@github.com'
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'test: poll committed bookmark values and exercise the actual scheduled autosave' | git commit-tree "$tree" -p 8694fd3f6e92a3e9c765e0d5992b7cf498010fe2)
          echo "$commit" > /tmp/library-evidence/commit.txt
          git ls-tree -r "$commit" > /tmp/library-evidence/tree.txt
          HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $HEADER" push origin "$commit:refs/heads/codex/library-poll-${GITHUB_RUN_ID}"
          git reset --hard "$commit"
          cp tests/browser/test_books_library.py /tmp/library-evidence/
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - name: All unit tests and unchanged production static build
        run: |
          set -o pipefail
          node --experimental-strip-types --test tests/unit/*.test.mjs test/reader/typography.test.mjs 2>&1 | tee /tmp/library-evidence/units.log
          BASE_PATH=/Reader-Web pnpm build > /tmp/library-evidence/build.log 2>&1
      - name: Complete real Library browser acceptance
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium webkit
          set +e
          status=0
          for engine in chromium webkit; do
            mkdir -p /tmp/library-evidence/$engine
            cases=BooksLibraryBrowser
            if [ "$engine" = chromium ]; then cases="$cases BooksLibraryFilesystem"; fi
            LIBRARY_BROWSER=$engine python tests/browser/test_books_library.py $cases > /tmp/library-evidence/$engine/results.log 2>&1
            result=$?
            echo "$engine=$result" >> /tmp/library-evidence/results.txt
            if [ "$result" -ne 0 ]; then status=1; fi
            if [ -d test-results ]; then mv test-results /tmp/library-evidence/$engine/screenshots; fi
          done
          LIBRARY_BROWSER=chromium python tests/browser/test_library_preview_cache.py > /tmp/library-evidence/preview-cache.log 2>&1
          result=$?
          echo "preview-cache=$result" >> /tmp/library-evidence/results.txt
          if [ "$result" -ne 0 ]; then status=1; fi
          if [ -d test-results ]; then mv test-results /tmp/library-evidence/preview-cache-screenshots; fi
          git diff --exit-code > /tmp/library-evidence/post-test-source.diff
          result=$?
          echo "unchanged-source=$result" >> /tmp/library-evidence/results.txt
          if [ "$result" -ne 0 ]; then status=1; fi
          cat /tmp/library-evidence/results.txt
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-committed-wait-evidence
          path: /tmp/library-evidence
          retention-days: 7
          if-no-files-found: error
