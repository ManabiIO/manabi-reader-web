name: Expo Android and web migration
on:
  pull_request:
    paths: ['apps/web/**', 'scripts/**', 'test/**', 'tests/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**', '.github/workflows/expo-migration.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: expo-migration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  export:
    name: Production ${{ matrix.platform }} export
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        platform: [web, android]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install reviewed dependency graph
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned dictionary and public assets
        run: |
          pnpm prepare:dictionary
          node scripts/prepare-expo.mjs
      - name: Export actual application and DOM workers
        env:
          BASE_PATH: /reader-web
          NODE_OPTIONS: --max-old-space-size=6144
          EXPO_NO_TELEMETRY: '1'
        run: |
          if [ '${{ matrix.platform }}' = 'web' ]; then
            pnpm --dir apps/web exec expo export --platform web --output-dir build --max-workers 2
            node scripts/expo-postbuild.mjs
            node scripts/verify-expo-export.mjs --platform web --output apps/web/build --report apps/web/build/asset-qualification.json
          else
            pnpm --dir apps/web exec expo export --platform android --output-dir dist-android --max-workers 2
            node scripts/verify-expo-export.mjs --platform android --output apps/web/dist-android --report apps/web/dist-android/asset-qualification.json
          fi
      - name: Verify Android-only generated project
        if: matrix.platform == 'android'
        run: |
          pnpm --dir apps/web exec expo prebuild --platform android --no-install
          test -d apps/web/android
          test ! -d apps/web/ios
          test ! -d apps/web/macos
      - name: Compile Android host and run origin policy tests
        if: matrix.platform == 'android'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          node scripts/verify-reader-dom-autolinking.mjs
          node scripts/prepare-android-qualification.mjs
          node --test patches/reader-dom/contract.test.mjs
          cd apps/web/android
          ./gradlew :expo-dom-webview:testDebugUnitTest :app:assembleRelease :app:assembleReleaseAndroidTest --no-daemon --max-workers=2
          cd ../../..
          node scripts/verify-expo-export.mjs --platform apk --output apps/web/android/app/build/outputs/apk/release/app-release.apk --report apps/web/dist-android/apk-qualification.json

      - name: Collect small packaging diagnostics
        if: always()
        run: |
          python - <<'PY_DIAGNOSTICS'
          from pathlib import Path
          import zipfile
          root = Path('apps/web/build' if '${{ matrix.platform }}' == 'web' else 'apps/web/dist-android')
          if (root / 'index.html').exists():
              print('EXPO_HTML_DIAGNOSTICS=' + (root / 'index.html').read_text()[:12000])
          with zipfile.ZipFile('expo-diagnostics.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              if root.exists():
                  for file in root.rglob('*'):
                      if file.is_file() and (file.suffix in ('.js', '.mjs', '.html', '.json') or file.name in ('SOURCE.txt', 'LICENSE')):
                          archive.write(file, file.relative_to(root))
          PY_DIAGNOSTICS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expo-${{ matrix.platform }}-diagnostics
          path: expo-diagnostics.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expo-${{ matrix.platform }}-evidence
          path: |
            apps/web/build
            apps/web/dist-android
            apps/web/android/app/build/outputs/apk/release
            apps/web/android/app/build/outputs/apk/androidTest/release
            pnpm-lock.yaml
          retention-days: 7
  regression:
    name: Adapted regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-expo.mjs
      - name: Strict application types
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm --dir apps/web check
      - name: Existing unit and migration contract tests
        if: success() || failure()
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          node --test --test-concurrency=2 tests/unit/*.test.mjs
      - name: Migration contract tests
        if: success() || failure()
        run: pnpm test:expo
      - name: Android instrumentation harness contracts
        if: success() || failure()
        run: node --test tests/android/harness.test.mjs
      - name: Existing reader regressions
        if: success() || failure()
        run: pnpm test:reader
      - name: Existing snippets and active React integration
        if: success() || failure()
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: |
          node test/snippets/run.mjs
          node test/snippets/react-run.mjs
      - name: Genuine SwiftF0 browser worker inference
        if: success() || failure()
        run: |
          pnpm exec playwright install --with-deps chromium
          node test/expo/onnx-runtime-browser.mjs
          node test/expo/native-library-cover-browser.mjs
      - name: Existing Whispersync core coverage
        if: success() || failure()
        run: pnpm test:whispersync
  browser:
    name: Existing browser acceptance
    needs: export
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [test_static_reader.py, test_library_parity.py, test_settings_controls.py, test_annotations_quality.py, test_offline_reader.py]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: expo-web-evidence
          path: evidence
      - run: |
          mkdir -p apps/web/build
          cp -a evidence/apps/web/build/. apps/web/build/
          test -f apps/web/build/expo-build-manifest.json
          test -f apps/web/build/index.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium
      - name: Exercise the same built application assertions
        run: python tests/browser/${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expo-browser-${{ matrix.suite }}
          path: test-results/
          retention-days: 7

  android-runtime:
    name: Packaged Android host runtime
    needs: export
    if: ${{ success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@v4
        with:
          name: expo-android-evidence
          path: evidence
      - name: Require qualified release and test APKs from this exact run
        run: |
          mkdir -p apps/web/android/app/build/outputs/apk
          cp -a evidence/apps/web/android/app/build/outputs/apk/. apps/web/android/app/build/outputs/apk/
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('evidence/apps/web/dist-android/apk-qualification.json'));if(p.passed!==true)throw Error('APK assets did not qualify');"
          test -f apps/web/android/app/build/outputs/apk/release/app-release.apk
          test -f apps/web/android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
      - name: Boot a fresh disposable emulator using official Android SDK tools
        env:
          ANDROID_SERIAL: emulator-5554
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          if adb -s "$ANDROID_SERIAL" get-state >/dev/null 2>&1; then
            echo 'Refusing an existing emulator' >&2
            exit 1
          fi
          sdkmanager --install 'system-images;android-35;google_apis;x86_64' emulator platform-tools
          export ANDROID_AVD_HOME="$(mktemp -d "$RUNNER_TEMP/manabi-reader-avd.XXXXXX")"
          printf 'no\n' | avdmanager create avd --name manabi-reader-qualification --package 'system-images;android-35;google_apis;x86_64'
          acceleration=off
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then acceleration=auto; fi
          mkdir -p test-results/android
          echo "Emulator acceleration: $acceleration (no host permission changes)"
          emulator -avd manabi-reader-qualification -port 5554 -accel "$acceleration" -memory 2048 -no-window -no-audio -no-snapshot -gpu swiftshader -no-boot-anim > test-results/android/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'adb -s "$ANDROID_SERIAL" emu kill >/dev/null 2>&1 || kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 600 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell input keyevent 82
          bash tests/android/run-qualification.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expo-packaged-android-runtime
          path: test-results/android/
          retention-days: 7
