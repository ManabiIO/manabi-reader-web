name: Expo Android and web migration
on:
  pull_request:
    paths: ['apps/web/**', 'scripts/**', 'test/**', 'tests/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/expo-migration.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: expo-migration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  export:
    name: Production ${{ matrix.platform }} export
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        platform: [web, android]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      # Temporary draft bootstrap: the sandbox cannot resolve the complete Expo
      # dependency graph without exhausting memory. Capture the resolved lock for
      # review/commit, then restore frozen-lockfile admission in this same PR.
      - name: Resolve migration dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Record reviewed dependency graph
        if: matrix.platform == 'web'
        run: |
          printf 'MANABI_EXPO_LOCK_GZIP_BASE64='
          gzip -c pnpm-lock.yaml | base64 -w 0
          printf '\n'
      - name: Prepare pinned dictionary and public assets
        run: |
          pnpm prepare:dictionary
          node scripts/prepare-expo.mjs
      - name: Export actual application and DOM workers
        env:
          BASE_PATH: /reader-web
          NODE_OPTIONS: --max-old-space-size=6144
          EXPO_NO_TELEMETRY: '1'
        run: |
          if [ '${{ matrix.platform }}' = 'web' ]; then
            pnpm --dir apps/web exec expo export --platform web --output-dir build --max-workers 2
            node scripts/expo-postbuild.mjs
          else
            pnpm --dir apps/web exec expo export --platform android --output-dir dist-android --max-workers 2
          fi
      - name: Verify Android-only generated project
        if: matrix.platform == 'android'
        run: |
          pnpm --dir apps/web exec expo prebuild --platform android --no-install
          test -d apps/web/android
          test ! -d apps/web/ios
          test ! -d apps/web/macos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expo-${{ matrix.platform }}-evidence
          path: |
            apps/web/build
            apps/web/dist-android
            pnpm-lock.yaml
          retention-days: 7
  regression:
    name: Adapted regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: pnpm install --no-frozen-lockfile
      - run: node scripts/prepare-expo.mjs
      - name: Strict application types
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm --dir apps/web check
      - name: Existing unit and migration contract tests
        if: success() || failure()
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          node --test --test-concurrency=2 tests/unit/*.test.mjs
          pnpm test:expo
      - name: Existing reader regressions
        if: success() || failure()
        run: pnpm test:reader
      - name: Existing snippets and active React integration
        if: success() || failure()
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: |
          node test/snippets/run.mjs
          node test/snippets/react-run.mjs
      - name: Existing Whispersync core coverage
        if: success() || failure()
        run: pnpm test:whispersync
  browser:
    name: Existing browser acceptance
    needs: export
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [test_static_reader.py, test_library_parity.py, test_settings_controls.py, test_annotations_quality.py, test_offline_reader.py]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: expo-web-evidence
          path: evidence
      - run: |
          mkdir -p apps/web/build
          cp -a evidence/apps/web/build/. apps/web/build/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium
      - name: Exercise the same built application assertions
        run: python tests/browser/${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expo-browser-${{ matrix.suite }}
          path: test-results/
          retention-days: 7
