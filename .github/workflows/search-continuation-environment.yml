name: Search continuation environment
on:
  push:
    branches: [review/unified-search-source-20260928]
    paths: [.github/workflows/search-continuation-environment.yml]
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 86374a42a53dc86c43b76a08202dd7d75bac0a92
          path: reader
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ManabiIO/manabitan
          ref: 5571ec9eb637b3ae3a0aec6aa411024499f6da98
          path: dictionary
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Retain exact media source and merge diagnostics
        working-directory: reader
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/search-development"
          git fetch --depth=1 origin dfc03296caefaeff37d0881361800ba7fa8918ec
          git archive --format=tar.gz --output="$RUNNER_TEMP/search-development/video-source.tar.gz" dfc03296caefaeff37d0881361800ba7fa8918ec
          git ls-tree -r dfc03296caefaeff37d0881361800ba7fa8918ec > "$RUNNER_TEMP/search-development/video-tree.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/search-development/reader-head.txt"
      - run: pnpm install --frozen-lockfile
        working-directory: reader
      - run: pnpm --dir apps/web exec svelte-kit sync
        working-directory: reader
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: dictionary
      - run: npm run build:libs && node web/build.mjs
        working-directory: dictionary
      - name: Archive development dependencies without credentials
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/search-development/reader-dependencies.tar.gz" -C reader node_modules apps/web/node_modules apps/web/.svelte-kit packages/*/node_modules
          tar -czf "$RUNNER_TEMP/search-development/dictionary-dependencies.tar.gz" -C dictionary node_modules ext/lib builds/manabitan-web
          cp "$(command -v node)" "$RUNNER_TEMP/search-development/node"
          cd "$RUNNER_TEMP/search-development"
          sha256sum *.tar.gz node > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: search-continuation-environment
          path: ${{ runner.temp }}/search-development
          retention-days: 1
          if-no-files-found: error
