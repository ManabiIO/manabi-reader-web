name: Library grid labels
on:
  pull_request:
    paths:
      - 'apps/web/src/lib/library/library-workspace.svelte'
      - 'tests/browser/test_library_grid_labels.py'
      - '.github/workflows/library-grid-labels.yml'
permissions:
  contents: read
concurrency:
  group: library-grid-labels-${{ github.ref }}
  cancel-in-progress: true
jobs:
  grid:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-expo.mjs
      - run: pnpm --dir apps/web check
      - name: Build real subpath app
        env:
          BASE_PATH: /reader-web
        run: pnpm build
      - name: Chromium and WebKit
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium webkit
          set +e
          status=0
          for engine in chromium webkit; do
            LIBRARY_BROWSER=$engine python tests/browser/test_library_grid_labels.py 2>&1 | tee test-results/grid-$engine.log
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then status=1; fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-grid-labels-evidence
          path: test-results/
          retention-days: 7
