name: Search source review snapshot
on:
  push:
    branches: [review/unified-search-source-20260928]
    paths: [.github/workflows/review-unified-search-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ManabiIO/manabitan
          ref: 7294d63871e7e0a6a6ee714b443c0f5e9dec7b1f
          path: .review-manabitan
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Retain source and compiler inputs only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/search-review"
          git rev-parse HEAD > "$RUNNER_TEMP/search-review/reader-revision.txt"
          git -C .review-manabitan rev-parse HEAD > "$RUNNER_TEMP/search-review/manabitan-revision.txt"
          git archive HEAD | gzip > "$RUNNER_TEMP/search-review/reader-source.tar.gz"
          git -C .review-manabitan archive HEAD | gzip > "$RUNNER_TEMP/search-review/manabitan-source.tar.gz"
          npm install --prefix "$RUNNER_TEMP/search-review/compiler" --ignore-scripts --no-audit --no-fund --save-exact svelte@5.57.1 typescript@6.0.3
          (cd "$RUNNER_TEMP/search-review" && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: unified-search-source-review
          path: ${{ runner.temp }}/search-review
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
