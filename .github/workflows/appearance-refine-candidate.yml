name: Appearance refinement candidate
on:
  push:
    branches: [research/appearance-refinement-20260919]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply exact reviewed patch
        run: |
          python3 - <<'PY'
          import hashlib,json,lzma,pathlib,subprocess
          patch=lzma.decompress(b''.join(pathlib.Path(f'.github/appearance-refine.{i}').read_bytes() for i in range(4)))
          assert hashlib.sha256(patch).hexdigest()=='9505d538d0b68770231fbf7a39400e5552d72729f8fe2c0775e7629cee431d63'
          pathlib.Path('/tmp/refinement.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/refinement.patch'],check=True)
          subprocess.run(['git','apply','/tmp/refinement.patch'],check=True)
          paths=[line.split('\t',2)[2] for line in subprocess.check_output(['git','apply','--numstat','/tmp/refinement.patch'],text=True).splitlines()]
          assert all(p.startswith(('apps/web/','tests/','docs/')) or p=='.github/workflows/appearance.yml' for p in paths)
          pathlib.Path('/tmp/paths.json').write_text(json.dumps(paths))
          PY
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - name: Format reviewed files and retain lint diagnostics
        run: |
          mkdir -p /tmp/refinement-evidence
          python3 - <<'PY'
          import json,pathlib,subprocess
          paths=json.loads(pathlib.Path('/tmp/paths.json').read_text())
          formatted=[p for p in paths if pathlib.Path(p).suffix in {'.ts','.js','.mjs','.svelte','.scss','.html','.md','.yml'} and not p.endswith('palettes.scss')]
          subprocess.run(['pnpm','exec','prettier','--write',*formatted],check=True)
          code=[p for p in paths if pathlib.Path(p).suffix in {'.ts','.js','.mjs','.svelte'}]
          with open('/tmp/refinement-evidence/lint.log','w') as log:
              result=subprocess.run(['pnpm','exec','eslint','--fix',*code],stdout=log,stderr=subprocess.STDOUT)
          pathlib.Path('/tmp/refinement-evidence/lint-status').write_text(str(result.returncode))
          PY
          node --experimental-strip-types tools/appearance/generate-css.mjs
      - name: Retain exact candidate blobs, never write commits or refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          out=pathlib.Path('/tmp/refinement-evidence');tree=[];source=[]
          for name in json.loads(pathlib.Path('/tmp/paths.json').read_text()):
              data=pathlib.Path(name).read_bytes();content=data.decode()
              expected=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'encoding':'utf-8','content':content}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as response: sha=json.load(response)['sha']
              assert sha==expected
              source.append({'path':name,'content':content})
              tree.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          (out/'source.json').write_text(json.dumps(source));(out/'tree.json').write_text(json.dumps(tree))
          (out/'base.txt').write_text('4d2f92db73af99566859f11ec6af70a552bf06ff')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: refinement-candidate-source
          path: /tmp/refinement-evidence
          retention-days: 7
      - name: Units and type check
        run: |
          set -o pipefail
          node --experimental-strip-types tools/appearance/generate-css.mjs --check
          node --experimental-strip-types --test tests/unit/*.test.mjs | tee /tmp/refinement-evidence/unit.log
          pnpm --dir apps/web check 2>&1 | tee /tmp/refinement-evidence/types.log
      - name: Static subpath build
        env:
          BASE_PATH: /Reader-Web
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/refinement-evidence/build.log
      - name: Real Chromium and WebKit acceptance
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium webkit
          set +e
          status=0
          for engine in chromium webkit; do
            mkdir -p /tmp/refinement-evidence/$engine
            APPEARANCE_BROWSER=$engine python tests/browser/test_appearance_refinement.py 2>&1 | tee /tmp/refinement-evidence/$engine/results.log
            result=${PIPESTATUS[0]}
            if [ "$result" -ne 0 ]; then status=1; fi
            if [ -d test-results ]; then mv test-results /tmp/refinement-evidence/$engine/screenshots; fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refinement-candidate-results
          path: /tmp/refinement-evidence
          retention-days: 7
