name: Snippet main rebase probe
on:
  push:
    branches: [codex/snippets-implementation-20260928]
    paths: ['.github/workflows/snippet-rebase-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Merge current main without committing
        id: merge
        shell: bash
        run: |
          set +e
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          status=$?
          mkdir -p /tmp/rebase-probe
          git rev-parse HEAD > /tmp/rebase-probe/head.txt
          git rev-parse origin/main > /tmp/rebase-probe/main.txt
          git merge-base HEAD origin/main > /tmp/rebase-probe/base.txt
          git status --porcelain=v1 > /tmp/rebase-probe/status.txt
          git diff --name-only --diff-filter=U > /tmp/rebase-probe/conflicts.txt
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            safe="$(printf '%s' "$path" | sed 's#/#__#g')"
            git show ":1:$path" > "/tmp/rebase-probe/$safe.base" || true
            git show ":2:$path" > "/tmp/rebase-probe/$safe.ours" || true
            git show ":3:$path" > "/tmp/rebase-probe/$safe.theirs" || true
          done < /tmp/rebase-probe/conflicts.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: snippet-rebase-probe
          path: /tmp/rebase-probe
          retention-days: 2
          if-no-files-found: error
