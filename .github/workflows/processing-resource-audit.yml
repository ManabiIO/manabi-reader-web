name: Hosted processing resource audit
# Temporary, read-only data inspection. No private source or dictionary contents
# are uploaded. Non-positive Yomitan sequences are data, not JMdict identities.
on:
  push:
    branches: [codex/manabi-web-preprocessing-r3]
    paths: ['.github/workflows/processing-resource-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'ManabiIO/manabi-reader-web'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Retrieve bounded public archive without credentials
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {brotliDecompressSync} from 'node:zlib';
          import {createHash} from 'node:crypto';
          const url='https://manabi.io/media/dictionaries/yomitan/JMdict_skeleton.zip.br';
          const response=await fetch(url,{redirect:'error',signal:AbortSignal.timeout(120000)});
          const http={source:url,status:response.status,encoding:response.headers.get('content-encoding'),etag:response.headers.get('etag'),lastModified:response.headers.get('last-modified')};
          console.log(JSON.stringify(http));
          if(!response.ok||!response.body)throw new Error('Hosted skeleton unavailable');
          const chunks=[];let total=0;
          for await(const chunk of response.body){total+=chunk.byteLength;if(total>128*1024*1024)throw new Error('Transfer budget');chunks.push(Buffer.from(chunk));}
          const transferred=Buffer.concat(chunks);
          const isZip=transferred.subarray(0,4).equals(Buffer.from([0x50,0x4b,3,4]));
          const zip=isZip?transferred:brotliDecompressSync(transferred,{maxOutputLength:256*1024*1024});
          if(zip.length>256*1024*1024||!zip.subarray(0,4).equals(Buffer.from([0x50,0x4b,3,4])))throw new Error('Invalid decoded ZIP');
          const metadata={...http,decodedZipBytes:zip.length,transferBytes:total,httpDecodedZip:isZip,decodedZipSha256:createHash('sha256').update(zip).digest('hex')};
          if(metadata.decodedZipSha256!=='ed82df87db17d683f41160fc70e1115037eb487c17a9533572c0c2be0b106b6b')throw new Error('Source changed since initial audit');
          writeFileSync(process.env.RUNNER_TEMP+'/skeleton.zip',zip);
          writeFileSync(process.env.RUNNER_TEMP+'/skeleton-metadata.json',JSON.stringify(metadata));
          JS
      - name: Classify real sequence values without conflating rows with semantic IDs
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,re,zipfile
          root=os.environ['RUNNER_TEMP']
          summary=json.load(open(root+'/skeleton-metadata.json'))
          with zipfile.ZipFile(root+'/skeleton.zip') as archive:
              entries=archive.infolist()
              names=[entry.filename for entry in entries]
              if len(names)!=len(set(names)) or len(names)>100000:raise ValueError('Duplicate/excessive entries')
              expanded=sum(e.file_size for e in entries)
              if expanded>1024*1024*1024:raise ValueError('Expansion budget')
              if archive.getinfo('index.json').file_size>1024*1024:raise ValueError('Oversized index')
              index=json.loads(archive.read('index.json'))
              summary['index']={k:index.get(k) for k in ['title','revision','format','sequenced']}
              if index.get('title')!='JMdict Skeleton' or index.get('format')!=3:raise ValueError('Wrong dictionary identity')
              banks=sorted((int(m.group(1)),n) for n in names if (m:=re.fullmatch(r'term_bank_([1-9][0-9]*)\.json',n)))
              if not banks or [n for n,_ in banks]!=list(range(1,len(banks)+1)):raise ValueError('Non-contiguous banks')
              rows=empty_glossaries=invalid_sequences=0
              sequence_min=sequence_max=None
              nonpositive={}
              maximum_bank=0
              for _,name in banks:
                  info=archive.getinfo(name)
                  maximum_bank=max(maximum_bank,info.file_size)
                  if info.file_size>16*1024*1024:raise ValueError('Term bank budget')
                  bank=json.loads(archive.read(name))
                  if not isinstance(bank,list):raise ValueError('Invalid term bank')
                  for row in bank:
                      if not isinstance(row,list) or len(row)!=8:raise ValueError('Unexpected tuple shape')
                      rows+=1
                      if row[5]==[]:empty_glossaries+=1
                      seq=row[6]
                      if isinstance(seq,bool) or not isinstance(seq,int) or abs(seq)>9007199254740991:
                          invalid_sequences+=1
                      elif seq<=0:
                          key=str(seq)
                          nonpositive[key]=nonpositive.get(key,0)+1
                      else:
                          sequence_min=seq if sequence_min is None else min(sequence_min,seq)
                          sequence_max=seq if sequence_max is None else max(sequence_max,seq)
              summary.update(entries=len(entries),expandedBytes=expanded,maxJsonBankBytes=maximum_bank,termBanks=len(banks),termRows=rows,emptyGlossaries=empty_glossaries,invalidSequences=invalid_sequences,nonPositiveSequences=nonpositive,sequenceMin=sequence_min,sequenceMax=sequence_max)
              print('RESOURCE_AUDIT_RESULT='+json.dumps(summary,ensure_ascii=False,sort_keys=True))
              if invalid_sequences:raise ValueError('Lossy/invalid source sequence')
          PY
