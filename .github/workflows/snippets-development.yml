name: Publish exact snippet implementation
on:
  push:
    branches: [codex/cloud-backed-snippets-20260926]
    paths: ['.snippets-transfer/ready']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'ManabiIO/manabi-reader-web' && github.ref == 'refs/heads/codex/cloud-backed-snippets-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply checksum-verified implementation
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,lzma,pathlib,subprocess
          parts=sorted(pathlib.Path('.snippets-transfer').glob('part-*.txt'))
          assert len(parts)==8
          raw=lzma.decompress(base64.b64decode(''.join(p.read_text() for p in parts),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='f693d6eef4d87de1c45ec91a8465a0c8bfa1940708172b4507fbf8f29a1a0882'
          stats=subprocess.check_output(['git','apply','--numstat','-'],input=raw).decode()
          for row in stats.splitlines():
              path=row.split('\t',2)[2]
              assert '..' not in pathlib.PurePosixPath(path).parts
              assert path.startswith(('apps/web/','test/snippets/','docs/')) or path in ('pnpm-lock.yaml','eslint.config.js')
          subprocess.run(['git','apply','--check','-'],input=raw,check=True)
          subprocess.run(['git','apply','--index','-'],input=raw,check=True)
          PY
          git rm -r .snippets-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(snippets): add portable rich text documents, cloud storage and scoped search'
          git push origin HEAD:refs/heads/codex/cloud-backed-snippets-20260926
