name: Publish exact snippet implementation
on:
  push:
    branches: [codex/snippets-implementation-20260928]
    paths: ['.github/workflows/snippet-source-publication.yml']
permissions:
  contents: write
concurrency:
  group: snippet-source-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ManabiIO/manabi-reader-web' && github.ref == 'refs/heads/codex/snippets-implementation-20260928'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply verified non-workflow source only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          base = 'd0afc6fab0530c597e68b5345ab28ab138d16ac1'
          helper = '.github/workflows/snippet-source-publication.yml'
          assert subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines() == [helper]
          shas = ['62ab6cbabf80e8523d555b1be0b5b5aaf7e35b8c','4fe21c5c3e961e757a532bad14d3ecd4c7c4859f','1afc212d9c2f0934bef0b2b36376359a7df35ef8','7a08572e48643e73469dbc435b271d7850163081','23201ec10c2eef5a8764e90d618335d591a97dba','c56dc59b1ed274fa256b35372f1ad015d12e17f8','a4256652d51c3f4a9412b78d88e9817b9b99bba0','31c20fc5d3ee5b0d3af3b16e8bc960c768fdc0c3']
          chunks = []
          for sha in shas:
              req = urllib.request.Request('https://api.github.com/repos/ManabiIO/manabi-reader-web/git/blobs/'+sha, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response: item=json.load(response)
              data=base64.b64decode(item['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              chunks.append(data)
          encoded=b''.join(chunks)
          assert len(encoded)==92072
          raw=lzma.decompress(base64.b64decode(encoded,validate=True),memlimit=128*1024*1024)
          assert len(raw)==324621
          assert hashlib.sha256(raw).hexdigest()=='78ade19bca765349b24d4d6d6c3f0d8c6cd41f4b6d3b4e567f0a1e0ab4400042'
          stats=subprocess.check_output(['git','apply','--numstat','-'],input=raw).decode().splitlines()
          assert len(stats)==43
          for row in stats:
              path=row.split('\t',2)[2]
              assert '..' not in pathlib.PurePosixPath(path).parts
              assert path.startswith(('apps/web/','test/snippets/')) or path in ('docs/snippets.md','eslint.config.js','pnpm-lock.yaml','THIRD_PARTY_UI_LICENSES.md','.github/workflows/snippets.yml')
          # Workflow installation and helper removal use the authorized connector separately.
          excluded='--exclude=.github/workflows/snippets.yml'
          subprocess.run(['git','apply','--check',excluded,'-'],input=raw,check=True)
          subprocess.run(['git','apply','--index',excluded,'-'],input=raw,check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(snippets): add cloud-backed rich text library, recovery and scoped search'
          git push origin HEAD:refs/heads/codex/snippets-implementation-20260928
