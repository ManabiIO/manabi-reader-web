name: Annotations quality
on:
  pull_request:
    paths:
      - 'apps/web/src/lib/components/book-reader/reader-annotations.svelte'
      - 'apps/web/src/lib/reader-annotations.ts'
      - 'apps/web/src/routes/b/+page.svelte'
      - 'tests/browser/test_annotations_quality.py'
      - '.github/workflows/annotations-quality.yml'
permissions:
  contents: read
concurrency:
  group: annotations-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  annotations:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-expo.mjs
      - run: pnpm --dir apps/web check
      - name: Build real subpath app
        env:
          BASE_PATH: /reader-web
        run: pnpm build
      - name: Record exact candidate
        run: |
          mkdir -p test-results/source
          git rev-parse HEAD > test-results/source/commit.txt
          git ls-tree -r HEAD > test-results/source/tree.txt
          cp tests/browser/test_annotations_quality.py test-results/source/
          cp apps/web/src/lib/components/book-reader/reader-annotations.svelte test-results/source/
      - name: Run Chromium and WebKit
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium webkit
          set +e
          status=0
          for engine in chromium webkit; do
            LIBRARY_BROWSER=$engine python tests/browser/test_annotations_quality.py 2>&1 | tee test-results/annotations-$engine.log
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then status=1; fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: annotations-quality-evidence
          path: test-results/
          retention-days: 7
