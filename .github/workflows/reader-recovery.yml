name: Reader recovery qualification
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'tests/browser/**'
      - '.github/workflows/reader-recovery.yml'
  # Main publication runs this suite in manabi-reader-ci.yml using its build.
permissions:
  contents: read
concurrency:
  group: reader-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-recovery:
    # This exact migration is qualified once in expo-migration.yml.
    if: >-
      !(github.repository == 'ManabiIO/manabi-reader-web' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'ManabiIO/manabi-reader-web' &&
        github.head_ref == 'feat/expo-android-web-migration') ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/feat/expo-android-web-migration')))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-expo.mjs
      - run: pnpm --dir apps/web check
      - name: Build the actual static Reader
        env:
          BASE_PATH: /reader-web
        run: pnpm build
      - name: Real storage loss and recovery through the application UI
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium
          set -o pipefail
          python tests/browser/test_reading_recovery.py 2>&1 | tee reading-recovery.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-recovery-results
          path: |
            reading-recovery.log
            test-results/
          retention-days: 3
