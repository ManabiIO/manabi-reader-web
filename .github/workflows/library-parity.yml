name: Library selection and reader chrome
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'tests/**'
      - 'tools/appearance/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/library-parity.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'tests/**'
      - 'tools/appearance/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/library-parity.yml'
permissions:
  contents: read
concurrency:
  group: library-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - name: Models, type checking and component lint
        run: |
          mkdir -p artifacts/parity
          git rev-parse HEAD > artifacts/parity/commit.txt
          git rev-parse HEAD^{tree} > artifacts/parity/tree.txt
          set -o pipefail
          node scripts/prepare-expo.mjs
          node --test --test-concurrency=4 tests/unit/*.test.mjs 2>&1 | tee artifacts/parity/units.log
          pnpm --dir apps/web check 2>&1 | tee artifacts/parity/types.log
          node tools/appearance/lint.mjs 2>&1 | tee artifacts/parity/components.log
      - name: Build real static app
        env:
          BASE_PATH: /reader-web
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee artifacts/parity/build.log
      - name: Actual browser gestures and persistence
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium webkit
          set +e
          status=0
          for engine in chromium webkit; do
            mkdir -p artifacts/parity/$engine
            LIBRARY_BROWSER=$engine python tests/browser/test_library_parity.py 2>&1 | tee artifacts/parity/$engine/results.log
            result=${PIPESTATUS[0]}
            if [ "$result" -ne 0 ]; then status=1; fi
            if [ -d test-results ]; then mv test-results artifacts/parity/$engine/screenshots; fi
          done
          git diff --exit-code > artifacts/parity/post-test-source.diff || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-parity-evidence
          path: artifacts/parity
          retention-days: 7
          if-no-files-found: error
