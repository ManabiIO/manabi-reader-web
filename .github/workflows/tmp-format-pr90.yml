name: Temporary PR 90 formatter
on:
  push:
    branches: [tmp/format-pr90-20260928]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add Node globals explicitly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/unit/fixtures/settings-script.mjs')
          s=p.read_text()
          needle="import assert from 'node:assert/strict';\n"
          if "node:process" not in s:
              s=s.replace(needle, needle+"import process from 'node:process';\n", 1)
          p.write_text(s)

          p=Path('tests/unit/settings-controls.test.mjs')
          s=p.read_text()
          needle="import assert from 'node:assert/strict';\n"
          if "node:timers" not in s:
              s=s.replace(needle, needle+"import { setImmediate } from 'node:timers';\n", 1)
          p.write_text(s)
          PY
      - name: Apply repository formatter
        run: |
          pnpm exec prettier --write \
            apps/web/src/lib/components/settings/user-font-actions.ts \
            tests/unit/dimension-presets.test.mjs \
            tests/unit/fixtures/settings-script.mjs \
            tests/unit/settings-controls.test.mjs \
            tests/unit/user-font-actions.test.mjs
      - name: Commit exact formatter output and remove temporary workflow
        run: |
          git rm .github/workflows/tmp-format-pr90.yml
          git add \
            apps/web/src/lib/components/settings/user-font-actions.ts \
            tests/unit/dimension-presets.test.mjs \
            tests/unit/fixtures/settings-script.mjs \
            tests/unit/settings-controls.test.mjs \
            tests/unit/user-font-actions.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(settings): apply repository formatter'
          git push origin HEAD:tmp/format-pr90-20260928
