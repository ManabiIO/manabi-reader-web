name: Appearance
on:
  push:
    branches: [feat/manabi-appearance-20260919]
  pull_request:
    paths:
      - 'apps/web/src/**'
      - 'apps/web/static/appearance-init.js'
      - 'apps/web/tailwind.config.*'
      - 'tools/appearance/**'
      - 'tests/browser/test_appearance.py'
      - 'tests/unit/appearance.test.mjs'
      - '.github/workflows/appearance.yml'
permissions:
  contents: read
concurrency:
  group: appearance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  appearance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec svelte-kit sync
      - run: node --experimental-strip-types tools/appearance/generate-css.mjs --check
      - run: node --experimental-strip-types --test tests/unit/*.test.mjs
      - run: pnpm --dir apps/web check
      - name: Build the real subpath application
        env:
          BASE_PATH: /Reader-Web
        run: pnpm build
      - name: Real browser acceptance
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
          set -o pipefail
          python tests/browser/test_appearance.py 2>&1 | tee appearance-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appearance-evidence
          path: |
            appearance-results.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7
