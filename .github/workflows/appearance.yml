name: Appearance
on:
  push:
    branches: [feat/manabi-appearance-20260919]
  pull_request:
    paths:
      - 'apps/web/src/**'
      - 'apps/web/tailwind.config.*'
      - 'tools/appearance/**'
      - '.github/workflows/appearance.yml'
permissions:
  contents: read
concurrency:
  group: appearance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  appearance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture reviewed source (no fonts or binary assets)
        run: |
          mkdir -p /tmp/appearance-evidence
          git rev-parse HEAD > /tmp/appearance-evidence/commit.txt
          git ls-tree -r HEAD > /tmp/appearance-evidence/tree.txt
          python3 - <<'PY'
          import json, pathlib, subprocess
          extensions = {'.ts', '.js', '.mjs', '.cjs', '.json', '.svelte', '.css', '.scss', '.html', '.yaml', '.yml', '.md'}
          files = []
          for name in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
              path = pathlib.Path(name)
              if path.suffix in extensions and path.stat().st_size < 2000000:
                  files.append({'path': name, 'content': path.read_text()})
          pathlib.Path('/tmp/appearance-evidence/source.json').write_text(json.dumps(files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: appearance-source
          path: /tmp/appearance-evidence
          retention-days: 7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check and build
        run: |
          pnpm --filter web check
          pnpm --filter web build
      - name: Browser appearance acceptance
        if: ${{ hashFiles('tools/appearance/run.mjs') != '' }}
        run: |
          pnpm exec playwright install --with-deps chromium
          node tools/appearance/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appearance-browser
          path: artifacts/appearance
          if-no-files-found: ignore
          retention-days: 7
