name: Reader bug review evidence
on:
  push:
    branches: [test/reader-bug-review-evidence-20260928]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Retain exact text sources and review dependencies
        run: |
          mkdir -p review-evidence
          git rev-parse HEAD > review-evidence/commit.txt
          git rev-parse HEAD^{tree} > review-evidence/tree.txt
          python - <<'PY'
          import pathlib, subprocess, tarfile
          paths = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          suffixes = {'.ts','.js','.mjs','.cjs','.json','.svelte','.py','.yml','.yaml','.md','.css','.scss','.html','.txt'}
          with tarfile.open('review-evidence/source.tar.gz','w:gz') as archive:
              for name in paths:
                  p = pathlib.Path(name)
                  if p.is_file() and p.suffix in suffixes:
                      archive.add(p, arcname=name, recursive=False)
          with tarfile.open('review-evidence/review-dependencies.tar.gz','w:gz', dereference=True) as archive:
              for name in ['typescript','esbuild','@esbuild/linux-x64','prettier']:
                  p = pathlib.Path('node_modules') / name
                  if p.exists(): archive.add(p, arcname='node_modules/' + name)
              for name in ['idb','fake-indexeddb','p-limit']:
                  p = pathlib.Path('apps/web/node_modules') / name
                  if p.exists(): archive.add(p, arcname='apps/web/node_modules/' + name)
          PY
      - name: Build and execute production statistics storage cases
        run: |
          set -o pipefail
          node test/reader/build-statistics-deletion-fixture.mjs
          node -e 'require("./test-results/statistics-deletion/fixture.node.cjs").run().then(r=>{ console.log(JSON.stringify(r,null,2)); if(r.some(x=>!x.passed)) process.exitCode=1 }).catch(e=>{console.error(e);process.exitCode=1})' | tee review-evidence/statistics-node.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-bug-review-evidence
          path: |
            review-evidence/
            test-results/statistics-deletion/
          retention-days: 3
