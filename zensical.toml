[project]
site_name = "Manabitan Reader"
site_description = "Read and organize your own ebooks in your browser."
site_url = "https://manabi.io/Manabi-Web/Docs/"
repo_url = "https://github.com/ManabiIO/manabi-reader-web"
repo_name = "ManabiIO/manabi-reader-web"
edit_uri = "edit/main/site-docs/"
docs_dir = "site-docs"
site_dir = "apps/web/build/docs"
extra_css = ["stylesheets/manabi.css"]

nav = [
  { "Overview" = "index.md" },
  { "Get started" = "get-started.md" },
  { "Your library" = "library.md" },
  { "Read a book" = "reading.md" },
  { "Accounts and data" = "accounts-and-data.md" },
  { "Move from Ttsu" = "move-from-ttsu.md" },
  { "Compare readers" = [
    { "Choose a reader" = "compare/index.md" },
    { "Manabitan Reader versus Ttsu Reader" = "compare/ttsu.md" },
    { "Manabitan Reader versus Yatsu Reader" = "compare/yatsu.md" },
    { "Manabitan Reader versus Manabi Reader for iOS and macOS" = "compare/native.md" },
  ] },
  { "Credits" = "credits.md" },
  { "Contribute" = "contribute.md" },
]

[project.theme]
language = "en"
font = false
favicon = "images/icon.png"
logo = "images/icon.png"
custom_dir = "overrides"
features = ["navigation.footer", "navigation.indexes", "search.highlight"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"
