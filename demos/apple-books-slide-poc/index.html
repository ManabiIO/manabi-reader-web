<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Slide · Manabi</title>
<style>body{margin:0;display:grid;place-items:center;min-height:100dvh;background:#f3e3c6;color:#28241f;font:16px system-ui}main{max-width:28rem;padding:28px}p{line-height:1.5}</style>
</head><body>
<main role="status"><strong>Opening layered Slide…</strong><p>Real Foliate pages · 15% under-page motion</p></main>
<script type="module">
const controller = new AbortController();
const timeout = setTimeout(() => controller.abort(), 20000);
try {
  const parts = await Promise.all(Array.from({length:11}, async (_, i) => {
    const path = './layered-v2/part-' + String(i).padStart(2,'0') + '.txt';
    const response = await fetch(new URL(path, document.baseURI), {signal:controller.signal});
    if (!response.ok) throw new Error('Download failed: ' + response.status);
    return (await response.text()).trim();
  }));
  const bytes = Uint8Array.from(atob(parts.join('')), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const data = await new Response(stream).arrayBuffer();
  const digest = await crypto.subtle.digest('SHA-256', data);
  const hash = Array.from(new Uint8Array(digest), x => x.toString(16).padStart(2,'0')).join('');
  if (hash !== 'b8a2268d53e6ca5e94da4f16d739a8be790fcfb7de7800929fa5f091197a925e') throw new Error('Demo integrity check failed');
  document.open();
  document.write(new TextDecoder().decode(data));
  document.close();
} catch (error) {
  document.querySelector('main').textContent = 'Could not open the demo: ' + error.message + '. Please reload to retry.';
} finally {
  clearTimeout(timeout);
}
</script></body></html>
